:root{
  --bg:#12151a; --bg2:#181c23; --panel:#1e232c; --panel2:#252b36;
  --line:#2f3746; --txt:#e6e9ef; --dim:#9aa4b5; --dim2:#6b7686;
  --good:#6ddba2; --warn:#f0b25b; --bad:#ef7a72; --info:#7fb3f0;
  --acc:#c9a227;
  --lt:#f0d9b5; --dk:#b58863;
  --sel:#f2e05e; --last:#cddc39;
  --r:12px;
  --boardmax:min(100%,calc(100vh - 290px));
  --font:'Space Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --display:'Archivo Black','Space Grotesk',Impact,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt); font-family:var(--font);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  touch-action:manipulation;              /* kill the 300ms double-tap zoom */
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
h1,h2,h3{line-height:1.25;font-weight:650}

/* ---------- layout ---------- */
.app{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%;
  padding:16px 16px 28px;
  padding-left:max(16px,env(safe-area-inset-left));
  padding-right:max(16px,env(safe-area-inset-right));
  padding-bottom:max(28px,env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px}
.brand b{font-size:19px;letter-spacing:-.02em}
.brand span{font-size:12px;color:var(--dim2)}
.spacer{flex:1}
.main{display:grid;grid-template-columns:minmax(300px,1fr) minmax(340px,420px);gap:20px;align-items:start}
@media(max-width:900px){
  .main{grid-template-columns:1fr}

  :root{--boardmax:min(100%,calc(100vh - 210px))}
}

/* ---------- generic bits ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card>h3{padding:11px 14px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);border-bottom:1px solid var(--line);background:var(--bg2);font-weight:600}
.pad{padding:14px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 13px;
  font-size:13px;font-weight:550;color:var(--txt);transition:.13s;white-space:nowrap}
.btn:hover{background:#303846;border-color:#3f4a5c}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1a1408}
.btn.pri:hover{background:#dcb52f;border-color:#dcb52f}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* segmented control */
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:6px 13px;border-radius:6px;font-size:13px;font-weight:550;color:var(--dim);transition:.13s}
.seg button:hover{color:var(--txt)}
.seg button[aria-selected=true]{background:var(--panel2);color:var(--txt);box-shadow:0 1px 3px #0006}
.sm2{display:none}
@media(max-width:540px){
  .seg .lg, #btnflip .lg{display:none}
  .seg .sm2, #btnflip .sm2{display:inline}
  .topbar{gap:6px} .brand b{font-size:17px}
  .seg button{padding:11px 9px}
  /* keep the tabs, sound and flip on one row instead of wrapping */
  #btnsound, #btnflip{padding:10px 12px;font-size:15px;line-height:1}
  /* two selects, then two buttons - not four wrapped rows */
}

select{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
  padding:7px 10px;font:inherit;font-size:13px;max-width:100%}

/* ---------- board ---------- */
/* Buttons directly under the board, explanation beneath them: the card is long
   enough that the other way round pushes the primary action off the screen. */
.leftcol > #fb{order:2}
.leftcol > #fb2{order:3}
.boardarea{display:flex;gap:9px;align-items:stretch;justify-content:center}
.boardcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.capstrip{display:flex;align-items:center;gap:1px;flex-wrap:wrap;min-height:0;padding:0 1px;
  width:100%;max-width:var(--boardmax);margin:0 auto}
body.mode-play .capstrip{min-height:19px}
.capstrip i{width:17px;height:17px;display:block;opacity:.9}
.capstrip i svg{width:100%;height:100%;display:block}
.capstrip b{font-size:12px;font-weight:700;color:var(--dim);margin-left:6px;
  font-variant-numeric:tabular-nums}
.boardwrap{position:relative;width:100%;max-width:var(--boardmax);margin:0 auto}

.boardgrid{position:relative;width:100%;border-radius:10px;overflow:hidden;
  box-shadow:0 10px 34px #000b, 0 0 0 1px #ffffff10, inset 0 0 60px #0000002e;
  user-select:none;-webkit-user-select:none;
  touch-action:none;                      /* a drag must not scroll the page */
  -webkit-touch-callout:none}
/* square board without relying on aspect-ratio, which older phones lack */
.boardgrid::after{content:'';display:block;padding-top:100%}
@supports (aspect-ratio:1){ .boardgrid{aspect-ratio:1} .boardgrid::after{display:none} }
.sqr{position:absolute;width:12.5%;height:12.5%}
.sqr.l{background:var(--lt)} .sqr.d{background:var(--dk)}
.sqr .co{position:absolute;font-size:clamp(7px,1.5vw,10px);font-weight:700;opacity:.55;pointer-events:none}
.sqr .co.f{right:3px;bottom:1px} .sqr .co.r{left:3px;top:1px}
.sqr.l .co{color:var(--dk)} .sqr.d .co{color:var(--lt)}

.ov{position:absolute;width:12.5%;height:12.5%;pointer-events:none}
.ov.last{background:var(--last);opacity:.38;animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:.38}}
.dot{animation:dotIn .16s cubic-bezier(.3,1.5,.5,1)}
@keyframes dotIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.ov.sel{box-shadow:inset 0 0 0 4px var(--sel)}
.ov.chk{background:radial-gradient(circle,#ff5b4d 0%,#ff5b4d55 55%,transparent 72%);
  animation:chkPulse 1.1s ease-in-out infinite}
@keyframes chkPulse{0%,100%{opacity:.75}50%{opacity:1}}
.ov.good{box-shadow:inset 0 0 0 4px var(--good)}
.ov.bad{box-shadow:inset 0 0 0 4px var(--bad)}
.ov.hint{box-shadow:inset 0 0 0 4px var(--info)}

.dot{position:absolute;width:12.5%;height:12.5%;display:grid;place-items:center;pointer-events:none}
.dot::after{content:'';display:block;width:30%;height:30%;border-radius:50%;
  background:#0000004d}

.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;display:grid;place-items:center;
  font-size:0;will-change:transform;transition:transform .21s cubic-bezier(.22,.86,.36,1);
  cursor:grab;z-index:3}
.pc.drag{transition:none;cursor:grabbing;z-index:9}
.pc svg{transition:transform .13s ease, filter .13s ease}
.pc.lift svg{transform:scale(1.08)}
.pc.drag svg{transform:scale(1.16);filter:drop-shadow(0 9px 9px #0008)}
.pc.landed svg{animation:land .22s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{0%{transform:scale(1.14)}60%{transform:scale(.95)}100%{transform:scale(1)}}

/* impact ring where a capture happened */
.fx{position:absolute;width:12.5%;height:12.5%;pointer-events:none;z-index:8}
.fx i{position:absolute;inset:12%;border-radius:50%;border:3px solid #ffca5f;
  animation:ring .42s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes ring{0%{transform:scale(.35);opacity:.95;border-width:5px}
                100%{transform:scale(1.5);opacity:0;border-width:1px}}
.fx.take i{border-color:#ff7d63}
/* the king topples when it is mated */
.pc.dead{transition:transform .5s cubic-bezier(.3,.9,.4,1)}
.pc.dead svg{transform:rotate(74deg) translateY(9%);filter:grayscale(.5) drop-shadow(0 2px 3px #000a)}
.pc svg{width:87%;height:87%;pointer-events:none;filter:drop-shadow(0 2px 2px #0006)}
.boardgrid.locked .pc{cursor:default}
svg.pw{--pf:#f6f3ec;--ps:#26282e}
svg.pb{--pf:#34373e;--ps:#0b0c0f}

/* promotion picker */
.promo{position:absolute;inset:0;background:#0b0d11cc;display:grid;place-items:center;z-index:20;
  backdrop-filter:blur(2px)}
.promo .opts{display:flex;gap:8px;background:var(--panel);padding:10px;border-radius:12px;
  border:1px solid var(--line)}
.promo button{width:58px;height:58px;border-radius:9px;background:var(--panel2);display:grid;place-items:center}
.promo button:hover{background:#3a4353}
.promo svg{width:78%;height:78%}

/* ---------- feedback ---------- */
.fb{border-radius:10px;padding:12px 14px;border:1px solid var(--line);background:var(--bg2);
  display:flex;gap:11px;align-items:flex-start}
.fb .ic{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:800;margin-top:1px}
.fb .bd{flex:1;min-width:0}
.fb .ti{font-weight:650;font-size:14px;margin-bottom:2px}
.fb .tx{font-size:13.5px;color:var(--dim);line-height:1.55}
.fb .tx b{color:var(--txt);font-weight:600}
.fb.good{border-color:#2e5d46;background:#16241d} .fb.good .ic{background:var(--good);color:#0b2a1c} .fb.good .ti{color:var(--good)}
.fb.warn{border-color:#5e4a25;background:#241e12} .fb.warn .ic{background:var(--warn);color:#2b1e06} .fb.warn .ti{color:var(--warn)}
.fb.bad{border-color:#5f3230;background:#241618}  .fb.bad .ic{background:var(--bad);color:#2d0f0d}  .fb.bad .ti{color:var(--bad)}
.fb.info{border-color:#2c4460;background:#151d28}  .fb.info .ic{background:var(--info);color:#08203a} .fb.info .ti{color:var(--info)}

/* ---------- moves ---------- */
.moves{display:flex;flex-wrap:wrap;gap:2px 0;font-variant-numeric:tabular-nums;font-size:13.5px;
  max-height:150px;overflow-y:auto}
.moves .no{color:var(--dim2);padding:2px 5px 2px 8px;font-size:12.5px}
.moves .mv{padding:2px 7px;border-radius:5px;font-weight:550;cursor:pointer}
.moves .mv:hover{background:var(--panel2)}
.moves .mv.cur{background:var(--acc);color:#1a1408}
.moves .mv.off{color:var(--bad)}
.moves .mv.cur.off{background:var(--bad);color:#2a0e0c}
.moves .mv.m-blunder{color:var(--bad);font-weight:700}
.moves .mv.m-mistake{color:var(--warn)}
.moves .mv.m-inacc{color:#d8c07a}
.moves .mv.m-best{color:var(--good)}
.gr{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:13px}
.gr .k{color:var(--dim)} .gr .v{font-variant-numeric:tabular-nums;font-weight:600}
.gr .v.bad{color:var(--bad)} .gr .v.warn{color:var(--warn)} .gr .v.good{color:var(--good)}
.diffwrap{margin-bottom:11px}
.diffbar{display:flex;gap:3px;background:var(--bg2);border:1px solid var(--line);
  border-radius:9px;padding:3px;margin-bottom:6px}
.diffbar button{flex:1;padding:7px 4px;border-radius:6px;font-size:11.5px;font-weight:650;
  color:var(--dim2);transition:.13s;position:relative}
.diffbar button:hover{color:var(--txt)}
.diffbar button[aria-selected=true]{color:#1a1408;background:var(--acc)}
.diffbar button:nth-child(3)[aria-selected=true]{background:#d98a3c}
.diffbar button:nth-child(4)[aria-selected=true]{background:#c9564a;color:#fff}
#powerbar{align-items:center;gap:7px}
.charges{font-size:12.5px;color:var(--dim);margin-right:2px;position:relative;white-space:nowrap}
.charges b{color:#e0b53a;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.charges em{position:absolute;left:0;top:-13px;font-style:normal;font-size:11.5px;
  font-weight:800;color:var(--good);animation:chargeUp .9s ease-out forwards}
@keyframes chargeUp{0%{opacity:0;transform:translateY(6px)}
                    25%{opacity:1;transform:translateY(0)}
                    100%{opacity:0;transform:translateY(-9px)}}
.charges.pop b{animation:chargePop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes chargePop{0%{transform:scale(1)}50%{transform:scale(1.45)}100%{transform:scale(1)}}
.btn.pw{padding:7px 9px 7px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:7px}
.btn.pw i{font-style:normal;font-size:11px;font-weight:800;color:#e0b53a;
  background:#3a3320;border:1px solid #5a4d26;border-radius:5px;padding:1px 5px}
.btn.pw:disabled i{color:var(--dim2);background:var(--bg2);border-color:var(--line)}
.upglist{display:flex;flex-wrap:wrap;gap:5px}
.upg{font-size:11.5px;font-weight:650;padding:4px 8px;border-radius:6px;
  background:#3a3320;color:#e0b53a;border:1px solid #5a4d26}
.offers{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.btn.offer{display:block;width:100%;text-align:left;padding:11px 13px;white-space:normal;
  border-color:#5a4d26;background:#2a2617}
.btn.offer:hover{background:#38321d;border-color:#7a6832}
.btn.offer > b{display:block;color:#e0b53a;font-size:13.5px;margin-bottom:2px}
.btn.offer span{display:block;font-size:12.5px;color:var(--dim);font-weight:400;line-height:1.45}
.btn.offer span b{display:inline;color:#e0b53a;font-weight:700}  /* emphasis, not a new line */
/* rarity + tag strip. Small, but it is what lets you read a build at a glance
   rather than re-reading three paragraphs every round. */
.btn.offer > i{display:block;margin:0 0 5px;font-style:normal;line-height:1}
.btn.offer em{display:inline-block;font-style:normal;font-size:9.5px;font-weight:800;
  letter-spacing:.09em;text-transform:uppercase;padding:2px 5px;border-radius:3px;
  margin-right:4px;border:1px solid}
.btn.offer em.rar.common{color:#8d9bb0;border-color:#3d4757}
.btn.offer em.rar.uncommon{color:#4fc3f7;border-color:#245a72}
.btn.offer em.rar.rare{color:#e0b53a;border-color:#6b5214;background:#2a2005}
.btn.offer em.tg{color:var(--dim2);border-color:var(--line)}
.btn.offer.combo{border-color:#7a6832}
.btn.offer.combo em.tg{color:#e0b53a;border-color:#6b5214}
.res{text-align:center;padding:14px;border-radius:10px;background:var(--bg2);
  border:1px solid var(--line);margin-bottom:12px}
.res b{display:block;font-size:17px;margin-bottom:3px}
.res span{font-size:12.5px;color:var(--dim)}
.think{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--acc);
  animation:pulse 1s ease-in-out infinite;margin-right:7px;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
label.lb{font-size:11.5px;color:var(--dim2);letter-spacing:.04em}
.moves .empty{color:var(--dim2);font-size:13px;padding:2px 8px}

/* ---------- explorer ---------- */
.ex{font-size:13px}
.ex .hd{display:flex;justify-content:space-between;color:var(--dim2);font-size:11px;
  letter-spacing:.05em;text-transform:uppercase;padding:0 0 6px}
.exrow{display:grid;grid-template-columns:52px 1fr 62px;gap:9px;align-items:center;padding:4px 0}
.exrow .sanb{font-weight:650;font-size:13px}
.exrow .bar{height:15px;border-radius:3px;overflow:hidden;display:flex;background:var(--panel2)}
.exrow .bar i{display:block;height:100%}
.exrow .bar .w{background:#e8e6e1} .exrow .bar .d{background:#7b8496} .exrow .bar .b{background:#31363f}
.exrow .n{text-align:right;color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums}
.exnote{color:var(--dim2);font-size:12px;line-height:1.5}

/* ---------- chapters ---------- */
.chlist{display:flex;flex-direction:column}
.ch{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--line);
  cursor:pointer;transition:.12s;text-align:left;width:100%}
.ch:last-child{border-bottom:none}
.ch:hover{background:var(--panel2)}
.ch[aria-selected=true]{background:#2a3140}
.ch .num{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:var(--bg2);
  display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--dim);margin-top:1px}
.ch[aria-selected=true] .num{background:var(--acc);color:#1a1408}
.ch .cb{flex:1;min-width:0}
.ch .ct{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ch .cd{font-size:12px;color:var(--dim2);margin-top:2px;line-height:1.45}
.pill{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:750;
  padding:2px 6px;border-radius:4px;background:var(--panel2);color:var(--dim)}
.pill.w{background:#e8e6e1;color:#1a1a1a} .pill.b{background:#31363f;color:#dfe3ea}
.pill.done{background:#2e5d46;color:var(--good)}

/* ---------- misc ---------- */
.jobs{display:grid;grid-template-columns:auto 1fr 1fr;gap:5px 10px;font-size:12.5px;
  align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.jobs .hh{color:var(--dim2);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:650}
.jobs .lbl{color:var(--dim)}
.jobs .v{display:flex;align-items:center;gap:6px;color:var(--dim)}
.jobs .v.yes{color:var(--good)} .jobs .v.no{color:var(--dim2)}
.jobs .v b{font-variant-numeric:tabular-nums;font-weight:600}
.plan{font-size:13px;color:var(--dim);line-height:1.6}
.plan b{color:var(--txt)}
.plan ul{margin:6px 0 0 17px} .plan li{margin-bottom:3px}
.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:var(--bg2);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--dim)}
.tiny{font-size:11.5px;color:var(--dim2);line-height:1.5}
.progbar{height:4px;background:var(--bg2);border-radius:2px;overflow:hidden}
.progbar i{display:block;height:100%;background:var(--good);transition:width .3s}
details summary{cursor:pointer;list-style:none;font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--bg2);
  display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-size:15px;color:var(--dim2)}
details[open] summary::after{content:"\2212"}
@supports (height:100dvh){
  :root{--boardmax:min(100%,calc(100dvh - 290px))}
  @media(max-width:900px){ :root{--boardmax:min(100%,calc(100dvh - 210px))} }
  @media (max-height:560px) and (min-width:640px){ :root{--boardmax:min(100%,calc(100dvh - 96px))} }
}
/* ---------- ARCADE ---------- */
body.arcade{
  /* Black on white. Every purple in the arcade skin resolves through these, so
     the whole chrome is four values plus the three accents that still have to
     mean something: gold for what you own, red for danger, green for good. */
  --ab:#ffffff; --ab2:#f4f3f0; --al:#111111; --ad:#dcdad4;
  --frame:#111111; --panelbg:#faf9f6; --ink:#111111; --ink2:#5f5c55;
  --clockbg:#e8e6e0; --clocktxt:#111111;
  --cy:#111111; --mg:#8c1c2e; --gd:#b8860b; --gr:#1f8a4c;
  background:#ffffff;
  background-color:#ffffff;
  background-attachment:fixed;
  color:#111111;
}
/* what the arcade never shows: the trainer chrome this was split out of */
body.arcade .topbar, body.arcade #fb, body.arcade #fb2,
body.arcade .keyhelp{ display:none !important; }
body.arcade .main{grid-template-columns:minmax(0,1fr) 272px;gap:18px;align-items:start}
body.arcade .app{max-width:1500px;padding:6px 14px 14px;gap:6px}
body.arcade{--boardmax:min(100%,calc(100vh - 104px))}
@supports (height:100dvh){ body.arcade{--boardmax:min(100%,calc(100dvh - 104px))} }
body.arcade #arcbot{grid-column:2;position:sticky;top:12px}
@media(max-width:900px){
  body.arcade .main{grid-template-columns:1fr}
  body.arcade #arcbot{grid-column:1;position:static}
  /* Centre the board in whatever height is left over: `margin:auto 0` on a
     single flex item splits the free space evenly above and below it, so the
     board sits in the middle of the screen rather than jammed under the header.
     It has to be the grid, not the board column: #arcbot is moved out of that
     column at boot, so sizing the column instead just pushed the power bar off
     the bottom of the screen mid-round. `1fr auto` gives the spare height to
     the board and keeps the power bar pinned on screen underneath it. */
  body.arcade .main{min-height:calc(100dvh - 16px);grid-template-rows:1fr auto}
  /* the sprite-overflow padding lives only on top at desktop sizes; split it so
     the gap above the board matches the gap below it */
  body.arcade .boardarea{margin-top:auto;margin-bottom:auto;min-height:0;
    padding-top:6px;padding-bottom:6px}
  /* tight gaps on a phone: every pixel spent here is a pixel that pushes the
     power buttons under the fold mid-round */
  body.arcade .leftcol{gap:6px}
  body.arcade .app{gap:4px;padding-top:4px}
  body.arcade{--boardmax:min(100%,calc(100vh - 150px))}
  @supports (height:100dvh){ body.arcade{--boardmax:min(100%,calc(100dvh - 150px))} }
}
body.arcade .boardarea{gap:10px}
/* Thin on purpose: every pixel here is a pixel the board does not get. The
   readout is set vertically so the number still fits inside the column. */

.arc{display:none;flex-direction:column;gap:9px}
body.arcade .arc{display:flex}
.arcbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* The wordmark is now the only piece of pure black-on-white branding: GAUNT in
   solid ink, LET knocked out of an ink block, so it reads as one mark rather
   than two colours. */
.arctitle{font-size:19px;font-weight:900;letter-spacing:.16em;
  color:var(--ink,#111);margin-right:auto;text-shadow:none}
.arctitle em{font-style:normal;background:var(--ink,#111);color:#fff;
  padding:1px 6px 2px;margin-left:3px;text-shadow:none}
.pips{display:flex;gap:3px}
.pips i{width:13px;height:13px;background:#e6e3dc;border:2px solid #111111;display:block}
.pips i.done{background:var(--gr);border-color:#1f8a4c;box-shadow:0 0 8px #1f8a4c90}
.pips i.now{background:var(--gd);border-color:#f0e0b0;box-shadow:0 0 10px #b8860b;
  animation:pipNow .8s ease-in-out infinite}
@keyframes pipNow{0%,100%{opacity:1}50%{opacity:.55}}
.abtn{font-family:inherit;font-size:12px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:#ffffff;background:var(--cy);border:0;
  padding:9px 14px;cursor:pointer;box-shadow:0 4px 0 #111111, 0 0 16px #11111150;
  transition:.08s}
.abtn:hover{filter:brightness(1.12)}
.abtn:active{transform:translateY(3px);box-shadow:0 1px 0 #111111}
.abtn.mag{background:var(--mg);box-shadow:0 4px 0 #8c1c2e,0 0 16px #8c1c2e50}
.abtn.ghost{background:#efece6;color:#5f5c55;box-shadow:0 4px 0 #faf9f6}
.abtn:disabled{background:#efece6;color:#8a867e;box-shadow:0 4px 0 #faf9f6;cursor:default}

body.arcade .boardgrid{
  border-radius:0;image-rendering:pixelated;
  box-shadow:0 0 0 4px var(--frame,#111111), 0 0 0 8px #ffffff,
             0 0 34px var(--glowa,rgba(125,74,232,.5))}
body.tilt.arcade .boardgrid,
body.tilt.arcade #fxcanvas,
body.tilt.arcade #boardfx{transform:perspective(1900px) rotateX(11deg) scale(1.01);
  transform-origin:50% 64%}
body.arcade .pc.drag{pointer-events:none}
body.arcade .sqr.l{background:var(--sqL,#452a86)}
body.arcade .sqr.d{background:var(--sqD,#1e1040)}
body.arcade .sqr .co{display:none}
body.arcade .ov.sel{box-shadow:inset 0 0 0 3px var(--gr)}
body.arcade .ov.chk{background:radial-gradient(circle,#ff2d5e 0%,#ff2d5e55 55%,transparent 72%)}
body.arcade .dot::after{background:#00000038}
/* a piece you can take is repainted red and leans forward slightly - it should
   read as prey, not as a marked square */
/* Only the sprite is touched, never .pc itself: the piece's transform is what
   positions it on the board, so animating it here would tear the board apart. */
body.arcade .pc.prey img{filter:drop-shadow(0 0 7px #ff2d4ecc) drop-shadow(0 4px 0 #0000004d);
  animation:preyPulse .85s ease-in-out infinite}
@keyframes preyPulse{
  0%,100%{filter:drop-shadow(0 0 5px #ff2d4e99) drop-shadow(0 4px 0 #0000004d)}
  50%    {filter:drop-shadow(0 0 11px #ff2d4eee) drop-shadow(0 4px 0 #0000004d)}
}
body.arcade .ov.scan{box-shadow:inset 0 0 0 3px var(--gd);animation:chkPulse .7s infinite}
/* Analyst marks your own hanging pieces - a different colour, because it is a
   warning rather than an opportunity */
body.arcade .ov.scan.risk{box-shadow:inset 0 0 0 3px var(--bad)}
body.arcade .pc{overflow:visible}
/* A piece carrying something you bought is recoloured gold - the same
   treatment the fairy pieces get. Before the sprites finish loading the SVG set
   stands in, so give that a gold glow rather than nothing. */
.pc.up svg{filter:drop-shadow(0 0 3px var(--gd,#b8860b))}
/* smaller pieces on larger squares is what makes the board read as a field
   rather than a diagram - the air around them is the effect */
body.arcade .pc img{width:78%;height:118%;position:absolute;bottom:4%;left:11%;
  image-rendering:pixelated;filter:drop-shadow(0 4px 0 #0000004d)}
/* the sprites are taller than their square, so the board must not clip them */
body.arcade .boardgrid{overflow:visible}
body.arcade .boardarea{padding-top:22px}
body.arcade .capstrip{display:none}

#boardfx{position:absolute;inset:0;pointer-events:none;z-index:12;overflow:visible}
#fxcanvas{position:absolute;inset:0;pointer-events:none;z-index:11}
.floaty{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:17px;
  letter-spacing:.04em;text-shadow:2px 2px 0 #0004;animation:floaty 1.1s ease-out forwards}
@keyframes floaty{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}
  20%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-150%) scale(1)}}
.checkflash{animation:ckf .42s ease-out}
@keyframes ckf{0%{box-shadow:0 0 0 0 #ff2d5e00}30%{box-shadow:0 0 0 10px #ff2d5eaa}
  100%{box-shadow:0 0 0 22px #ff2d5e00}}

.banner{position:absolute;inset:0;display:grid;place-content:center;text-align:center;
  z-index:20;pointer-events:none;opacity:0;transition:opacity .2s}
.banner.show{opacity:1}
.banner b{display:block;font-size:34px;font-weight:900;letter-spacing:.1em;
  color:var(--gd);text-shadow:0 0 20px #b8860b,4px 4px 0 #0003;
  animation:bpop .45s cubic-bezier(.2,1.8,.4,1)}
.banner span{display:block;margin-top:6px;font-size:13px;font-weight:700;
  letter-spacing:.1em;color:#111111;text-shadow:2px 2px 0 #0003}
.banner.lose b{color:var(--mg);text-shadow:0 0 20px #8c1c2e,4px 4px 0 #0003}
@keyframes bpop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

.arcover{position:absolute;inset:0;z-index:18;display:none;place-content:center;
  text-align:center;padding:18px;background:#fffffff2;
  box-shadow:inset 0 0 0 3px var(--ink,#111)}
.arcover.on{display:grid}
.arcover h4{font-size:clamp(17px,3.2vw,26px);font-weight:900;letter-spacing:.1em;
  color:var(--ink,#111);text-shadow:none;margin-bottom:4px}
.arcover p{font-size:12.5px;color:#5f5c55;margin-bottom:14px;letter-spacing:.04em}
.arcover .diffbar{max-width:340px;margin:0 auto 12px}
.arcover .offers{max-width:420px;margin:0 auto;text-align:left}
.arcover .abtn{font-size:14px;padding:13px 26px}
/* ---------- the shop, drawn on the board ----------
   Between rounds the opponent's pieces are swept off and the upgrades take
   their half of the board, so the piece you have selected and the things you
   can buy for it are visible at the same time. Only the top half is covered:
   the bottom half is still a live board you tap to choose a piece. */
.arcover.shop{inset:0 0 25% 0;place-content:start stretch;text-align:left;
  padding:7px 9px;gap:4px;overflow:auto;
  background:linear-gradient(#fffffff5,#f7f6f2ee);
  border-bottom:2px solid var(--frame,#111111)}
.shophead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.arcover.shop .abtn.sm{font-size:11px;padding:8px 12px;letter-spacing:.06em}
.shopnote{font-size:12.5px;color:#4a473f;line-height:1.5}
.shopwho{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#6f6c64}
/* Two columns always - six cards in one column will not fit, and the labels are
   short enough to pair up even on a phone. */
.shoprow{display:grid;grid-template-columns:1fr 1fr;gap:5px}
/* Each upgrade is a box that says what it does. It used to be a bare name with
   the explanation in a `title`, which on a phone means no explanation at all. */
/* A quiet grey card, a shade off the paper behind it. The ink rule and the
   shadow are what make it an object; the fill only has to separate it from the
   panel, and gold shouted for attention the shop does not need. */
.shopcard{display:grid;grid-template-columns:1fr auto;gap:1px 6px;
  align-items:baseline;text-align:left;font-family:inherit;cursor:pointer;
  padding:7px 9px;border:2px solid var(--ink);border-radius:0;
  background:var(--card,#edebe6);color:var(--ink);box-shadow:3px 3px 0 var(--ink);
  transition:transform .06s, box-shadow .06s, background .12s}
.shopcard:hover:not(:disabled){background:var(--cardhi,#e0ddd5)}
.shopcard:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.shopcard b{font-family:var(--font);font-weight:700;font-size:12px;letter-spacing:.01em}
.shopcard i{font-family:var(--display);font-style:normal;font-size:11px;
  background:#00000014;padding:1px 6px;justify-self:end}
.shopcard span{grid-column:1 / -1;font-size:10px;line-height:1.35;opacity:.72;
  font-weight:500}
/* what you cannot afford goes flat: no shadow, no rule, no weight */
.shopcard:disabled{background:transparent;color:var(--ink3);border-color:var(--ink3);
  border-style:dashed;box-shadow:none;cursor:default}
.shopcard:disabled i{background:transparent;color:var(--ink3)}
body.arcade.night{--card:#26231f; --cardhi:#302c27}
body.arcade.night .shopcard i{background:#ffffff14}
.hud{display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  background:#faf9f6f2;border:2px solid #111111;padding:10px}
body.arcade #arcbot .pbtn{flex:1 1 calc(50% - 4px);justify-content:space-between}
body.arcade #arcbot .chg{flex:1 0 100%;margin-bottom:2px}
.chg{font-size:12px;font-weight:800;letter-spacing:.08em;color:#5f5c55;margin-right:2px}
.chg b{color:var(--gd);font-size:20px;text-shadow:0 0 12px #b8860b90;
  font-variant-numeric:tabular-nums}
.chg.pop b{animation:chargePop .35s cubic-bezier(.3,1.6,.5,1)}
.pbtn{font-family:inherit;font-size:11px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:#ffffff;background:var(--gd);border:0;padding:8px 10px;
  cursor:pointer;box-shadow:0 3px 0 #8a6412;display:inline-flex;gap:6px;align-items:center}
.pbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #8a6412}
.pbtn i{font-style:normal;background:#00000014;padding:1px 5px}
.pbtn:disabled{background:#e6e3dc;color:#8a867e;box-shadow:0 3px 0 #faf9f6;cursor:default}
.pbtn.armed{background:var(--gr);box-shadow:0 3px 0 #1f8a4c,0 0 14px #1f8a4c80;
  animation:pipNow .9s ease-in-out infinite}
.upgrow{display:flex;gap:5px;flex-wrap:wrap;min-height:22px}
.caps{background:#faf9f6f2;border:2px solid var(--frame,#111111);padding:8px 9px}
.caprow{display:flex;align-items:center;gap:2px;min-height:24px;flex-wrap:wrap}
.caprow em{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:#6f6c64;width:44px;flex:0 0 auto}
.caprow img{width:15px;height:22px;image-rendering:pixelated;display:block}
.caprow b{margin-left:auto;font-size:13px;font-weight:900;color:var(--gd);
  font-variant-numeric:tabular-nums}
.caprow.none i{font-style:normal;font-size:10px;color:#bdbab4}
.uchip{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 7px;background:#f4ecd6;color:var(--gd);border:1px solid #b8860b}
.arcmsg{font-size:12.5px;line-height:1.5;color:#5f5c55;background:#faf9f6f2;
  border-left:3px solid var(--cy);padding:8px 11px;min-height:20px}
.arcmsg b{color:#fff}
/* ---------- the shop ---------- */
.shopnote b{color:#fff}
.shopwho b{color:var(--gd,#b8860b)}
.pbtn.shopbuy{justify-content:space-between}
.chg em{position:static;font-style:normal;color:var(--good,#1f8a4c);
  font-size:12px;font-weight:800;margin-right:5px}
/* music volume slider, styled to match the pixel buttons */
.tcustom input[type=range]{flex:1;min-width:80px;height:20px;-webkit-appearance:none;
  appearance:none;background:transparent;margin:0}
.tcustom input[type=range]::-webkit-slider-runnable-track{height:6px;background:#dcdad4;
  border:1px solid var(--frame,#111111)}
.tcustom input[type=range]::-moz-range-track{height:6px;background:#dcdad4;
  border:1px solid var(--frame,#111111)}
.tcustom input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:12px;height:16px;margin-top:-6px;background:var(--gd,#b8860b);
  border:1px solid #ffffff;cursor:pointer}
.tcustom input[type=range]::-moz-range-thumb{width:12px;height:16px;border-radius:0;
  background:var(--gd,#b8860b);border:1px solid #ffffff;cursor:pointer}
/* ---------- the move clock ----------
   A bar across the top of the screen rather than a number tucked in a corner:
   you read a shrinking bar without looking away from the board, which is the
   whole point of putting a clock on the game. It changes colour as it goes and
   the board itself flushes red for the last five seconds. */
.clockbar{position:relative;height:10px;width:100%;background:var(--clockbg,#ffffff);
  border:2px solid var(--frame,#111111);overflow:hidden;flex:0 0 auto;
  opacity:.35;transition:opacity .2s}
.clockbar.on{opacity:1}
.clockbar i{position:absolute;left:0;top:0;bottom:0;display:block;
  background:var(--cy,#111111);box-shadow:0 0 12px var(--cy,#111111);
  transition:background .25s, box-shadow .25s}
.clockbar b{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  font-size:9px;font-weight:900;letter-spacing:.06em;font-variant-numeric:tabular-nums;
  color:var(--clocktxt,#fff);text-shadow:0 0 6px #0004;line-height:1}
.clockbar.warn i{background:var(--gd,#b8860b);box-shadow:0 0 12px var(--gd,#b8860b)}
.clockbar.crit i{background:#ff2d4e;box-shadow:0 0 16px #ff2d4e}
.clockbar.crit{animation:clockPanic .45s steps(2) infinite}
@keyframes clockPanic{0%,100%{filter:brightness(1)}50%{filter:brightness(1.85)}}
/* the last five seconds bleed into the board */
#boardwrap.panic::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:16;
  box-shadow:inset 0 0 60px 8px #ff2d4e66;animation:panicPulse .5s ease-in-out infinite}
@keyframes panicPulse{0%,100%{opacity:.45}50%{opacity:1}}
.tpanel{background:#faf9f6f2;border:2px solid var(--frame,#111111);padding:9px 10px}
/* the colour pickers are a settings drawer, not something you need on screen
   while you are playing */
body.arcade #settings{border:2px solid var(--frame,#111111);background:#faf9f6f2}
body.arcade #settings > summary{background:transparent;border-bottom:0;color:#6f6c64;
  font-size:10px;font-weight:800;letter-spacing:.14em;padding:8px 10px}
body.arcade #settings[open] > summary{border-bottom:2px solid var(--frame,#111111)}
body.arcade #settings > summary::after{color:#6f6c64}
body.arcade #settings .tpanel{border:0;background:transparent}
.thead{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:#6f6c64;margin-bottom:7px}
.presets{display:flex;gap:4px;margin-bottom:8px}
.presets button{flex:1;display:flex;align-items:center;gap:0;padding:4px 5px;background:#f4f3f0;
  border:2px solid #e6e3dc;cursor:pointer;font-family:inherit;font-size:9px;font-weight:800;
  letter-spacing:.04em;text-transform:uppercase;color:#6f6c64}
.presets button:hover{border-color:var(--frame,#111111);color:#fff}
.presets button i{display:block;width:8px;height:13px;margin-right:0}
.presets button i:last-of-type{margin-right:5px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.crow{display:flex;align-items:center;gap:6px;cursor:pointer}
.crow input[type=color]{width:26px;height:24px;padding:0;border:2px solid #e6e3dc;
  background:none;cursor:pointer;flex:0 0 auto}
.crow span{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  color:#6f6c64;line-height:1.15}
.tcustom{display:flex;align-items:center;gap:6px;margin-top:8px}
.tbtn{font-family:inherit;font-size:9.5px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:#6f6c64;background:#f4f3f0;border:2px solid #e6e3dc;
  padding:5px 9px;cursor:pointer}
.tbtn.on{color:#ffffff;background:var(--frame,#111111);border-color:var(--frame,#111111)}
.arcfoot{font-size:10px;color:#8a867e;letter-spacing:.04em;text-align:center;padding:2px 0 4px}
.arcfoot a{color:#5f5c55}
.offers .btn.offer{border-color:#b8860b;background:#efece6}
.offers .btn.offer:hover{background:#f4ecd6}

@media(max-width:540px){
  body.arcade .app{padding-left:8px;padding-right:8px}
  .arctitle{font-size:15px;letter-spacing:.1em}
  .banner b{font-size:24px}
  .pbtn{font-size:10px;padding:8px 8px}
}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* ---------- touch devices ---------- */
@media (pointer: coarse){
  .btn{padding:12px 17px;font-size:14.5px}
  .btn.sm{padding:10px 14px;font-size:13.5px}
  .seg{padding:4px}
  .seg button{padding:11px 14px;font-size:13.5px}
  /* 16px stops iOS Safari zooming the page when a select is focused */
  select{padding:11px 12px;font-size:16px}
  .moves{max-height:none}
  .moves .mv{padding:7px 10px;font-size:14.5px}
  .moves .no{padding:7px 5px 7px 8px;font-size:13.5px}
  .ch{padding:15px 14px}
  details summary{padding:16px 14px}
  .promo button{width:68px;height:68px}
  .sqr .co{font-size:10px;opacity:.7}
  .keyhelp{display:none}
}
/* must come after the coarse-pointer block, which would otherwise re-inflate
   the tabs and wrap Flip onto a row of its own */
@media (pointer: coarse) and (max-width:540px){
  .seg button{padding:11px 8px;font-size:13px}
  #btnsound, #btnflip{padding:12px 11px;font-size:15px;line-height:1}
}
/* landscape phones: put the board beside the panel instead of above it */
@media (max-height:560px) and (min-width:640px){
  .main{grid-template-columns:minmax(220px,1fr) minmax(280px,1.1fr);gap:14px}
  :root{--boardmax:min(100%,calc(100vh - 96px))}
  .app{padding-top:10px;gap:10px}
}

/* ---------- typography pass ----------
   The old skin shouted through letter-spacing on every label, which is what
   read as generic: tracking is a substitute for a typeface having its own
   voice. Archivo Black has plenty, so most of that tracking comes back off. */
body.arcade{font-family:var(--font)}
body.arcade .arctitle{font-family:var(--display);letter-spacing:.02em;font-size:22px;
  font-weight:400}
body.arcade .arctitle em{letter-spacing:.02em}
body.arcade .arcover h4{font-family:var(--display);font-weight:400;letter-spacing:.01em;
  font-size:clamp(20px,3.6vw,30px)}
body.arcade .arcover p{font-size:13px;letter-spacing:0;color:var(--ink2,#5f5c55)}
body.arcade .abtn{font-family:var(--display);font-weight:400;letter-spacing:.03em}
body.arcade .pbtn{font-family:var(--font);font-weight:700;letter-spacing:.01em;
  text-transform:none;font-size:12.5px}
body.arcade .pbtn i{font-family:var(--display);font-weight:400}
body.arcade .chg{font-family:var(--font);font-weight:700;letter-spacing:.06em;font-size:11px}
body.arcade .chg b{font-family:var(--display);font-weight:400;font-size:24px;
  letter-spacing:0;text-shadow:none}
body.arcade .shopwho{letter-spacing:.04em;font-size:11px}
body.arcade .shopwho b{font-family:var(--display);font-weight:400;letter-spacing:0}
body.arcade .uchip{font-family:var(--font);font-weight:700;letter-spacing:.02em;
  text-transform:none}
body.arcade .thead{font-family:var(--font);font-weight:700;letter-spacing:.1em}
body.arcade .arcmsg{font-size:13px;letter-spacing:0}
body.arcade .arcmsg b{font-family:var(--display);font-weight:400}
body.arcade .diffbar button{font-family:var(--font);font-weight:700;letter-spacing:.02em;
  text-transform:none;font-size:13px}
body.arcade .banner b{font-family:var(--display);font-weight:400;letter-spacing:.01em}
body.arcade .clockbar b{font-family:var(--display);font-weight:400;letter-spacing:0}
body.arcade #settings > summary{font-family:var(--font);font-weight:700;letter-spacing:.1em}

/* ---------- board frame ----------
   A printed-block frame rather than a glow: a heavy ink rule, a hairline of
   paper inside it, and a hard offset shadow with no blur, the way a
   letterpressed board sits on the page. The coordinates live in the frame
   itself, which is the part that makes it read as a chess board and not a grid. */
body.arcade .boardgrid{
  border-radius:0;image-rendering:pixelated;
  box-shadow:0 0 0 2px #ffffff, 0 0 0 16px var(--frame,#111),
             12px 12px 0 16px #11111124}
/* the frame reaches 16px past the grid, so the eval bar needs clearing room or
   it reads as part of the frame */
body.arcade .boardarea{gap:24px}
body.arcade .boardwrap{padding:0}
.coords{position:absolute;pointer-events:none;font-family:var(--display);font-weight:400;
  font-size:10px;color:#ffffff;letter-spacing:.06em;display:flex;opacity:.9;
  z-index:17}   /* under .arcover, or they bleed through the shop panel */
.coords.files{left:0;right:0;bottom:-16px;height:16px;align-items:center}
.coords.files span{flex:1;text-align:center}
.coords.ranks{top:0;bottom:0;left:-16px;width:16px;flex-direction:column;align-items:center}
.coords.ranks span{flex:1;display:flex;align-items:center;justify-content:center}
@media(max-width:540px){
  .coords{font-size:8px}
  body.arcade .boardgrid{box-shadow:0 0 0 2px #ffffff, 0 0 0 12px var(--frame,#111),
                                    8px 8px 0 12px #11111124}
  body.arcade .boardarea{gap:18px}
  .coords.files{bottom:-12px;height:12px}
  .coords.ranks{left:-12px;width:12px}
}

/* =====================================================================
   DESIGN PASS
   One system instead of a pile of one-off rules. Three ideas carry it:

   1. Every surface is the same object - paper, a 2px ink rule, and a hard
      offset shadow with no blur. Nothing glows, nothing is soft; it is a
      printed thing, which is what suits pixel art and a monochrome palette.
   2. Every control presses. Buttons sit on their shadow and move into it on
      :active, so the whole UI answers back. That is most of what "arcade"
      actually feels like.
   3. Labels are small, tracked and grey; values are large, black and
      Archivo. The eye should never have to work out which is which.
   ===================================================================== */
body.arcade{
  --ink:#111111; --ink2:#6a665e; --ink3:#a8a49b;
  --paper:#fbfaf7; --paper2:#ffffff;
  --frame:var(--ink);              /* a dozen older rules still read this */
  --rule:2px solid var(--ink);
  --drop:4px 4px 0 var(--ink);
  --drop-sm:3px 3px 0 var(--ink);
  background-color:var(--paper);
  background-image:radial-gradient(#0000000d 1px, transparent 1px);
  background-size:18px 18px;
  background-attachment:fixed;
}

/* ---- header ---- */
body.arcade #arctop{margin-bottom:2px}
body.arcade .arcbar{gap:12px;padding:0 0 10px;border-bottom:var(--rule);align-items:flex-end}
body.arcade .arctitle{font-size:26px;line-height:1;margin-right:auto}
body.arcade .arctitle em{padding:2px 7px 3px;margin-left:4px}
body.arcade .pips{gap:4px;padding-bottom:3px}
body.arcade .pips i{width:11px;height:11px;border:2px solid var(--ink);background:transparent}
body.arcade .pips i.done{background:var(--ink);border-color:var(--ink);box-shadow:none}
body.arcade .pips i.now{background:var(--gd);border-color:var(--ink);
  box-shadow:0 0 0 3px #b8860b33}

/* ---- the one button ---- */
body.arcade .abtn, body.arcade .pbtn{
  border:var(--rule);border-radius:0;background:var(--ink);color:#fff;
  box-shadow:var(--drop-sm);transition:transform .06s, box-shadow .06s, background .12s}
body.arcade .abtn:hover, body.arcade .pbtn:hover:not(:disabled){background:#000}
body.arcade .abtn:active, body.arcade .pbtn:active:not(:disabled){
  transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
body.arcade .abtn.ghost{background:var(--paper2);color:var(--ink)}
body.arcade .abtn.ghost:hover{background:var(--ink);color:#fff}
body.arcade .pbtn:disabled{background:var(--paper2);color:var(--ink3);
  border-color:var(--ink3);box-shadow:none;transform:none}
body.arcade .pbtn i{background:#ffffff26;color:#fff;border-radius:0;padding:2px 6px}
body.arcade .pbtn:disabled i{background:transparent;color:var(--ink3)}
/* the shop's buy buttons keep the gold, but as a fill under the same rule */
body.arcade .pbtn.shopbuy:not(:disabled){background:var(--gd);color:var(--ink)}
body.arcade .pbtn.shopbuy:not(:disabled):hover{background:#a5780a;color:#fff}
body.arcade .pbtn.shopbuy:not(:disabled) i{background:#0000001f;color:var(--ink)}

/* ---- panels ---- */
body.arcade .hud, body.arcade .caps, body.arcade .arcmsg, body.arcade #settings{
  background:var(--paper2);border:var(--rule);border-radius:0;box-shadow:var(--drop)}
body.arcade .hud{gap:14px;padding:12px 14px;align-items:center}
body.arcade .caps{padding:10px 12px}
body.arcade .arcmsg{padding:10px 12px;border-left:var(--rule);color:var(--ink2)}
body.arcade .arcmsg b{color:var(--ink)}
body.arcade #arcbot{gap:12px}

/* ---- stats: label above, value below ---- */
body.arcade .stat{display:flex;flex-direction:column;gap:1px;line-height:1}
body.arcade .stat em{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink3)}
body.arcade .stat b{font-family:var(--display);font-weight:400;font-size:22px;
  color:var(--ink);letter-spacing:0}
body.arcade .stat.gold b{color:var(--gd)}
body.arcade .stat small{font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.02em}
body.arcade .statrule{width:2px;align-self:stretch;background:var(--ink);opacity:.12}

/* ---- chips ---- */
body.arcade .uchip{background:var(--paper2);color:var(--ink);border:2px solid var(--ink);
  border-radius:0;box-shadow:2px 2px 0 var(--ink);padding:4px 8px;font-size:10.5px}
body.arcade .uchip.empty{color:var(--ink3);border-color:var(--ink3);border-style:dashed;
  box-shadow:none;font-weight:400;text-transform:none;letter-spacing:.02em}

/* ---- the clock, docked under the header ---- */
body.arcade .clockbar{height:14px;border:var(--rule);background:var(--paper2);
  box-shadow:var(--drop-sm);margin:0 0 2px;opacity:.3}
body.arcade .clockbar.on{opacity:1}
body.arcade .clockbar i{background:var(--ink);box-shadow:none;
  transition:background .2s, width .1s linear}
body.arcade .clockbar.warn i{background:var(--gd);box-shadow:none}
body.arcade .clockbar.crit i{background:#c81e37;box-shadow:none}
body.arcade .clockbar b{color:#fff;text-shadow:none;font-size:8px;mix-blend-mode:difference}

/* ---- overlays ---- */
body.arcade .arcover{background:#fbfaf7f7;box-shadow:none;border:none;padding:22px}
body.arcade .arcover.shop{border-bottom:var(--rule);background:#fbfaf7fa}
body.arcade .arcover h4{margin-bottom:6px}
body.arcade .diffbar{background:var(--paper2);border:var(--rule);border-radius:0;padding:3px;
  gap:3px;box-shadow:var(--drop-sm)}
body.arcade .diffbar button{border-radius:0;color:var(--ink2);padding:9px 4px}
body.arcade .diffbar button:hover{color:var(--ink);background:#0000000a}
body.arcade .diffbar button[aria-selected=true]{background:var(--ink);color:#fff}
body.arcade .diffbar button:nth-child(3)[aria-selected=true]{background:var(--gd);color:var(--ink)}
body.arcade .diffbar button:nth-child(4)[aria-selected=true]{background:#c81e37;color:#fff}

/* ---- settings ---- */
body.arcade #settings{background:var(--paper2)}
body.arcade #settings > summary{color:var(--ink);border-bottom:0;padding:11px 13px}
body.arcade #settings[open] > summary{border-bottom:var(--rule)}
body.arcade #settings .tpanel{background:transparent;padding:12px 13px}
body.arcade .thead{color:var(--ink3);font-size:9px;letter-spacing:.14em}
body.arcade .tbtn{border:2px solid var(--ink);border-radius:0;background:var(--paper2);
  color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
body.arcade .tbtn.on{background:var(--ink);color:#fff}
body.arcade .tbtn:active{transform:translate(2px,2px);box-shadow:none}
body.arcade .presets button{border:2px solid var(--ink);border-radius:0;background:var(--paper2);
  color:var(--ink)}
body.arcade .crow{border:2px solid var(--ink3);border-radius:0;background:var(--paper2)}


/* ---- banner ---- */
body.arcade .banner b{font-size:clamp(26px,6vw,52px);color:var(--ink);text-shadow:none;
  -webkit-text-stroke:0}
body.arcade .banner span{color:var(--ink2)}

body.arcade .arcfoot{color:var(--ink3);letter-spacing:.03em}
body.arcade .arcfoot a{color:var(--ink2)}
@media(max-width:540px){
  body.arcade .arctitle{font-size:20px}
  body.arcade .stat b{font-size:18px}
  body.arcade .hud{gap:10px;padding:10px 11px}
}

/* =====================================================================
   NIGHT
   The whole skin already resolves through six tokens, so night is those
   six values inverted rather than a second stylesheet. Ink becomes paper
   and paper becomes ink; the accents only need taking down a little,
   because gold and red still have to mean the same things.

   The board is the one thing NOT recoloured - it is the player's own
   choice and a night board is a preference, not a lighting fix. It is
   dimmed instead, which takes the pieces down with it and keeps the two
   in step whatever colours are set.
   ===================================================================== */
body.arcade.night{
  --ink:#e9e6e0; --ink2:#9c968c; --ink3:#5f5a52;
  --paper:#12110f; --paper2:#1c1a17;
  --gd:#d9a520; --gr:#4bbd7a;
  color:var(--ink);
  background-color:var(--paper);
  background-image:radial-gradient(#ffffff0f 1px, transparent 1px);
}
body.arcade.night .abtn, body.arcade.night .pbtn{background:var(--ink);color:var(--paper)}
body.arcade.night .abtn:hover, body.arcade.night .pbtn:hover:not(:disabled){background:#fff}
body.arcade.night .abtn.ghost{background:var(--paper2);color:var(--ink)}
body.arcade.night .abtn.ghost:hover{background:var(--ink);color:var(--paper)}
body.arcade.night .pbtn i{background:#00000038;color:var(--paper)}
/* the night fill is declared after the design pass, so it beat the disabled
   rule on source order and every button looked live */
body.arcade.night .pbtn:disabled{background:var(--paper2);color:var(--ink3);
  border-color:var(--ink3);box-shadow:none}
body.arcade.night .pbtn:disabled i{background:transparent;color:var(--ink3)}
body.arcade.night .pbtn.shopbuy:not(:disabled){background:var(--gd);color:#141210}
body.arcade.night .pbtn.shopbuy:not(:disabled):hover{background:#f0bd3a}
body.arcade.night .pbtn.shopbuy:not(:disabled) i{background:#0000002e;color:#141210}
body.arcade.night .arctitle em{background:var(--ink);color:var(--paper)}
body.arcade.night .diffbar button[aria-selected=true]{background:var(--ink);color:var(--paper)}
body.arcade.night .diffbar button:hover{background:#ffffff12}
body.arcade.night .tbtn.on{background:var(--ink);color:var(--paper)}
body.arcade.night .arcover{background:#12110ff2}
body.arcade.night .arcover.shop{background:#12110ffa}
body.arcade.night .clockbar b{color:var(--paper)}
body.arcade.night .coords{color:#141210}   /* dark on the white trim */
/* The board is left exactly as it is - same squares, same pieces, in either
   mode. Only the trim inverts: a white rule at night, so the board still sits
   on the page as a printed object rather than dissolving into the dark. */
body.arcade.night .boardgrid{
  box-shadow:0 0 0 2px var(--paper), 0 0 0 16px #ffffff, 12px 12px 0 16px #00000059}
@media(max-width:540px){
  body.arcade.night .boardgrid{
    box-shadow:0 0 0 2px var(--paper), 0 0 0 12px #ffffff, 8px 8px 0 12px #00000059}
}

/* =====================================================================
   BOARD FIRST
   With the evaluation bar gone the board is the only thing in its column,
   so it takes the width it can get and sits in the middle of the screen
   rather than hanging off the header - the chess.com arrangement. The
   centring is done with `margin:auto 0` on a single flex item, which
   splits the leftover height evenly above and below it.
   ===================================================================== */
/* The frame is drawn with box-shadow, which paints OUTSIDE the element and is
   clipped by the viewport - so the board has to leave room for its own trim
   (16px a side) and its offset shadow, or the border disappears at the edges. */
body.arcade{--boardmax:min(calc(100% - 44px),calc(100vh - 128px))}
@supports (height:100dvh){
  body.arcade{--boardmax:min(calc(100% - 44px),calc(100dvh - 128px))} }
body.arcade .main{min-height:calc(100dvh - 16px);align-items:stretch}
body.arcade #arcbot{align-self:start}
body.arcade .leftcol{min-height:0}
body.arcade .boardarea{margin-top:auto;margin-bottom:auto;min-height:0;gap:0}
@media(max-width:900px){
  body.arcade{--boardmax:min(calc(100% - 34px),calc(100dvh - 158px))}
  body.arcade .main{grid-template-rows:1fr auto}
  body.arcade .boardarea{padding-top:6px;padding-bottom:6px}
}

/* On a phone the header cannot hold the wordmark, eight pips and two buttons -
   it wrapped and pushed FLIP onto its own line. The pips are the redundant
   part: the HUD under the board already says ROUND 4 / 8. */
@media(max-width:560px){
  body.arcade .arcbar{flex-wrap:nowrap;gap:8px}
  body.arcade .pips{display:none}
  body.arcade .arctitle{font-size:19px}
  body.arcade .abtn.ghost{padding:8px 10px;font-size:11px}
}

/* the powers sit directly under the board: they are a decision about the game
   in front of you, not a menu item */
body.arcade #powerbar{display:flex;gap:8px;margin-top:14px;justify-content:center}
body.arcade #powerbar .pbtn{flex:0 1 190px;justify-content:space-between;padding:11px 13px;

  body.arcade #powerbar{margin-top:10px;gap:6px}

/* ---------- move trail ----------
   A streak along the path the piece took: a soft bloom under a hard core, both
   thinning towards the square it left. White for your moves, black for theirs.
   Pure CSS on one rotated element - no canvas, no timer, no sprite. */
.trail{position:absolute;inset:0;pointer-events:none;z-index:2}
.trail .scorch, .trail .streak{position:absolute;display:block;
  transform-origin:50% 50%;
  transform:translate(-50%,-50%) rotate(var(--ang,0deg))}
.trail .scorch{height:9%;border-radius:99px;filter:blur(7px);opacity:.42}
.trail .streak{height:2.6%;border-radius:99px}
.trail.mine .scorch{background:linear-gradient(90deg,
  #ffffff00 0%, #ffffff55 20%, #ffffffaa 52%, #ffffffe6 82%, #ffffff 100%)}
.trail.mine .streak{background:linear-gradient(90deg,
  #ffffff00 0%, #ffffff59 16%, #ffffffb3 42%, #ffffffe6 70%, #ffffff 92%);
  box-shadow:0 0 8px #ffffff70}
.trail.theirs .scorch{background:linear-gradient(90deg,
  #00000000 0%, #00000047 20%, #0000008c 52%, #000000cc 82%, #000000 100%)}
.trail.theirs .streak{background:linear-gradient(90deg,
  #00000000 0%, #0000004d 16%, #000000a6 42%, #000000d9 70%, #000000 92%);
  box-shadow:0 0 8px #00000059}

/* On a phone the shop has only the top six ranks to work with, so the cards are
   tightened until all six fit without clipping - a card cut in half at the fold
   looks broken, and scrolling a panel this small is worse than shrinking it. */
@media(max-width:560px){
  /* two ranks is all your lineup needs; give the last 2% back to the shop so
     the bottom row of cards is not clipped by a few pixels */
  body.arcade .arcover.shop{inset:0 0 23% 0;padding:6px 7px;gap:2px}

  body.arcade .arcover.shop .abtn.sm{font-size:10px;padding:7px 9px}

  body.arcade .shoprow{gap:4px}
  body.arcade .shopcard{padding:4px 7px;gap:0 5px}
  body.arcade .shopcard b{font-size:11px}
  body.arcade .shopcard i{font-size:10px;padding:1px 4px}
  body.arcade .shopcard span{font-size:9px;line-height:1.3}
}

<script>
/* =========================================================================
   1. PIECE GRAPHICS
   ========================================================================= */
const SHAPES = {
P:`<circle cx="22.5" cy="12.8" r="5.6"/>
   <path d="M17.6 18.4h9.8c-.3 3.6-2.4 5.2-2.7 9.4h-4.4c-.3-4.2-2.4-5.8-2.7-9.4z"/>
   <path d="M12.6 33.8c0-4.3 4.5-6.4 9.9-6.4s9.9 2.1 9.9 6.4z"/>
   <rect x="10.4" y="33.4" width="24.2" height="4.4" rx="1.8"/>`,

N:`<path d="M22.9 9.2c-2 0-4 .6-6 1.9l-1-2.3-2.1 4.2c-2.7 2.5-4.5 5.6-5.3 9.2-.6 2.8-.3 4.8.9 5.9 1 .9 2.1.9 3.2.1.8-.6 1.6-1.7 2.4-3.2l1.3-2.5 2.9 1.5-1.7 3.4c-1.1 2.2-2.9 4-5.4 5.5-1.7 1-2.5 2.3-2.5 3.8h24.6c.7-5 .7-9.3.1-13.1-.7-4.4-2.5-7.9-5.3-10.4-2.2-2-4.6-3-7.1-3z"/>
   <rect x="9.4" y="33.4" width="26.2" height="4.4" rx="1.8"/>
   <circle cx="16.4" cy="16.6" r="1.35" style="fill:var(--ps);stroke:none"/>
   <path d="M27.6 14.2c1.9 2 3 4.6 3.4 7.9" style="fill:none;stroke-width:1.2;opacity:.45"/>`,

B:`<circle cx="22.5" cy="8.2" r="2.4"/>
   <path d="M22.5 10.8c4.6 4 7 8.1 7 11.6 0 2.4-1.2 4.3-3.6 5.5h-6.8c-2.4-1.2-3.6-3.1-3.6-5.5 0-3.5 2.4-7.6 7-11.6z"/>
   <path d="M14.2 31.2c1.9-1.6 4.7-2.4 8.3-2.4s6.4.8 8.3 2.4z"/>
   <rect x="10.8" y="30.8" width="23.4" height="3.6" rx="1.5"/>
   <rect x="9.4" y="34.2" width="26.2" height="3.6" rx="1.5"/>
   <path d="M19.6 21.4l5.8-5.8" style="fill:none;stroke-width:1.6;stroke-linecap:round"/>`,

R:`<path d="M11.4 8.6h4.6v3.1h4.2V8.6h4.6v3.1h4.2V8.6h4.6v7.3l-3.1 2.6h-16l-3.1-2.6z"/>
   <path d="M14.4 18.5h16.2l1 11.8H13.4z"/>
   <path d="M11.6 30.2h21.8v3.9H11.6z"/>
   <rect x="9.4" y="33.8" width="26.2" height="4" rx="1.6"/>`,

Q:`<circle cx="22.5" cy="7.4" r="2.3"/><circle cx="10.6" cy="12.4" r="2.3"/>
   <circle cx="34.4" cy="12.4" r="2.3"/><circle cx="15.6" cy="8.8" r="2"/>
   <circle cx="29.4" cy="8.8" r="2"/>
   <path d="M10.9 14.6l3.3 12.4h16.6l3.3-12.4-5.8 5-2.4-9-2.9 9.6h-1l-2.9-9.6-2.4 9z"/>
   <path d="M13.6 27h17.8c1 2 .6 3.2-.4 4.2H14c-1-1-1.4-2.2-.4-4.2z"/>
   <rect x="10.4" y="31.4" width="24.2" height="3.2" rx="1.3"/>
   <rect x="9" y="34.2" width="27" height="3.6" rx="1.5"/>`,

K:`<path d="M22.5 5v7.6M19 8.4h7" style="fill:none;stroke-width:2.2;stroke-linecap:round"/>
   <path d="M22.5 12.6c-1.6 0-3 .6-4.1 1.8-2.7-2.3-6.8-1.7-8.4 1.3-1.3 2.3-.7 5.1 1.2 7.4 2 2.4 5.6 5.2 11.3 8.9 5.7-3.7 9.3-6.5 11.3-8.9 1.9-2.3 2.5-5.1 1.2-7.4-1.6-3-5.7-3.6-8.4-1.3-1.1-1.2-2.5-1.8-4.1-1.8z"/>
   <path d="M13.4 29.4c4.6-2.4 13.6-2.4 18.2 0v2.6c-4.6-2.4-13.6-2.4-18.2 0z"/>
   <rect x="10.4" y="31.6" width="24.2" height="3.1" rx="1.3"/>
   <rect x="9" y="34.3" width="27" height="3.5" rx="1.5"/>`
};
/* The upgraded pieces keep the familiar silhouette and add a gold gem, so they
   read instantly as "that is your bishop, but better". */
SHAPES.A = SHAPES.B + '<circle cx="22.5" cy="21.5" r="3.1" style="fill:#e0b53a;stroke:var(--ps);stroke-width:1.1"/>';
SHAPES.C = SHAPES.R + '<circle cx="22.5" cy="24" r="3.1" style="fill:#e0b53a;stroke:var(--ps);stroke-width:1.1"/>';
SHAPES.M = SHAPES.Q + '<circle cx="22.5" cy="26" r="3.4" style="fill:#e0b53a;stroke:var(--ps);stroke-width:1.1"/>';

function pieceSVG(ch){
  const white = ch === ch.toUpperCase();
  // a top-lit gradient rather than a flat fill: it reads as a physical object
  // instead of a diagram, and costs nothing because the defs are shared
  return '<svg viewBox="0 0 45 45" class="' + (white ? 'pw' : 'pb') + '">' +
    '<g fill="url(#g' + (white ? 'w' : 'b') + ')" stroke="var(--ps)" stroke-width="1.5" ' +
    'stroke-linejoin="round" stroke-linecap="round">' + SHAPES[ch.toUpperCase()] + '</g></svg>';
}

/* =========================================================================
   2. CHESS RULES ENGINE
   ========================================================================= */
const FILES = "abcdefgh";
const START_FEN = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";

const rowOf = i => i >> 3, colOf = i => i & 7;
const onBoard = (r,c) => r >= 0 && r < 8 && c >= 0 && c < 8;
const nameOf = i => FILES[colOf(i)] + (8 - rowOf(i));
const idxOf  = s => (8 - Number(s[1])) * 8 + FILES.indexOf(s[0]);
/* The board holds one-character strings, and the search asks "is this mine?"
   and "what is this worth?" millions of times. Doing that with toUpperCase()
   is a string allocation per question; a char code and a pre-built table keyed
   by BOTH cases cost nothing. */
const isWhitePiece = p => { const c = p.charCodeAt(0); return c > 64 && c < 91; };
const colorOf = p => isWhitePiece(p) ? 'w' : 'b';
const other = c => c === 'w' ? 'b' : 'w';
/* A and C are the roguelike pieces: archbishop (bishop + knight) and
   chancellor (rook + knight). Standard chess never puts them on the board. */
const VALUE = { P:1, N:3, B:3, R:5, Q:9, K:100, A:7, C:8, M:11 };
const VAL_OF = {};                     // keyed by the actual character, both cases
for (const k in VALUE){ VAL_OF[k] = VALUE[k]; VAL_OF[k.toLowerCase()] = VALUE[k]; }
const valOf = p => VAL_OF[p] || 0;

const OFF_N = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
const OFF_B = [[-1,-1],[-1,1],[1,-1],[1,1]];
const OFF_R = [[-1,0],[1,0],[0,-1],[0,1]];
const OFF_K = OFF_B.concat(OFF_R);
const OFF_A = [[-2,-2],[-2,2],[2,-2],[2,2]];      // two squares diagonally, jumping
const OFF_D = [[-2,0],[2,0],[0,-2],[0,2]];        // two squares orthogonally, jumping

/* ---- how a piece moves ----------------------------------------------------
   Every piece on the board is a *set of movement primitives* rather than a
   letter with hard-coded rules. A knight is PW_KNIGHT; a queen is PW_DIAG plus
   PW_ORTHO; the fairy pieces are just other combinations. The point is that a
   piece can also be *given* a primitive it did not start with - that is what
   the shop sells - and the whole engine (move generation, check detection,
   static exchange, evaluation) reads the same set, so an upgraded piece is
   understood everywhere instead of only where someone remembered to special
   case it.

   `st.u` carries the bought primitives, one entry per square, and travels with
   the piece as it moves. Standard chess leaves it empty, so nothing about
   ordinary play changes - the perft suite still passes unmodified. */
const PW_PAWN = 1, PW_KNIGHT = 2, PW_DIAG = 4, PW_ORTHO = 8, PW_STEP = 16,
      PW_ALFIL = 32, PW_DABBA = 64;
const BASE_PW = { P:PW_PAWN, N:PW_KNIGHT, B:PW_DIAG, R:PW_ORTHO,
                  Q:PW_DIAG|PW_ORTHO, K:PW_STEP,
                  A:PW_DIAG|PW_KNIGHT, C:PW_ORTHO|PW_KNIGHT,
                  M:PW_DIAG|PW_ORTHO|PW_KNIGHT };
const PW_OF = {};                      // BASE_PW for both cases, no toUpperCase
for (const k in BASE_PW){ PW_OF[k] = BASE_PW[k]; PW_OF[k.toLowerCase()] = BASE_PW[k]; }
const noUp = new Array(64).fill(0);
/* What the piece standing on square i can do, base moves plus anything bought
   for it. `u` is optional so every existing caller keeps working. */
function pwrAt(b, u, i){
  const p = b[i];
  if (p === '') return 0;
  return (PW_OF[p] || 0) | ((u && u[i]) || 0);
}
/* Centipawns added by bought primitives. The base letters keep their tuned
   values; this only prices what the shop bolted on. */
const PW_CP = { [PW_KNIGHT]:300, [PW_DIAG]:320, [PW_ORTHO]:480,
                [PW_STEP]:260, [PW_ALFIL]:130, [PW_DABBA]:130, [PW_PAWN]:0 };
function upCp(bits){
  let v = 0;
  for (const k in PW_CP) if (bits & Number(k)) v += PW_CP[k];
  return v;
}

function fenToState(fen){
  const [bd, t, cast, ep, hm, fm] = fen.trim().split(/\s+/);
  const b = new Array(64).fill('');
  let i = 0;
  for (const ch of bd){
    if (ch === '/') continue;
    if (ch >= '1' && ch <= '8') i += Number(ch); else b[i++] = ch;
  }
  return { b, t, cast: cast === '-' ? '' : cast, ep: ep === '-' ? -1 : idxOf(ep),
           hm: Number(hm) || 0, fm: Number(fm) || 1 };
}
function stateToFen(st){
  let bd = '';
  for (let r = 0; r < 8; r++){
    let run = 0;
    for (let c = 0; c < 8; c++){
      const p = st.b[r*8+c];
      if (p === '') run++;
      else { if (run) { bd += run; run = 0; } bd += p; }
    }
    if (run) bd += run;
    if (r < 7) bd += '/';
  }
  return [bd, st.t, st.cast || '-', st.ep < 0 ? '-' : nameOf(st.ep), st.hm, st.fm].join(' ');
}
function findKing(b, color){
  const k = color === 'w' ? 'K' : 'k';
  for (let i = 0; i < 64; i++) if (b[i] === k) return i;
  return -1;
}
/* Is square (r,c) attacked by side `by`?
   Scans outward from the target and asks what each candidate attacker can do,
   so a piece that bought a primitive gives check with it like any other. */
function attacked(b, r, c, by, u){
  const wantWhite = by === 'w';
  const mine = p => { const c = p.charCodeAt(0);
    return wantWhite ? (c > 64 && c < 91) : (c > 96 && c < 123); };
  const can = (rr, cc, bit) => {
    const j = rr*8+cc, p = b[j];
    return p !== '' && mine(p) && (pwrAt(b, u, j) & bit);
  };
  // a pawn attacks the two squares diagonally in front of it
  const pd = by === 'w' ? 1 : -1;             // pawn of `by` sits one rank "behind"
  for (const dc of [-1, 1]){
    const rr = r + pd, cc = c + dc;
    if (onBoard(rr,cc) && can(rr, cc, PW_PAWN)) return true;
  }
  for (const [dr,dc] of OFF_N){
    const rr = r+dr, cc = c+dc;
    if (onBoard(rr,cc) && can(rr, cc, PW_KNIGHT)) return true;
  }
  for (const [dr,dc] of OFF_K){
    const rr = r+dr, cc = c+dc;
    if (onBoard(rr,cc) && can(rr, cc, PW_STEP)) return true;
  }
  for (const [dr,dc] of OFF_A){
    const rr = r+dr, cc = c+dc;
    if (onBoard(rr,cc) && can(rr, cc, PW_ALFIL)) return true;
  }
  for (const [dr,dc] of OFF_D){
    const rr = r+dr, cc = c+dc;
    if (onBoard(rr,cc) && can(rr, cc, PW_DABBA)) return true;
  }
  for (const [dr,dc] of OFF_B){
    for (let rr = r+dr, cc = c+dc; onBoard(rr,cc); rr += dr, cc += dc){
      const j = rr*8+cc;
      if (b[j] !== ''){ if (mine(b[j]) && (pwrAt(b, u, j) & PW_DIAG)) return true; break; }
    }
  }
  for (const [dr,dc] of OFF_R){
    for (let rr = r+dr, cc = c+dc; onBoard(rr,cc); rr += dr, cc += dc){
      const j = rr*8+cc;
      if (b[j] !== ''){ if (mine(b[j]) && (pwrAt(b, u, j) & PW_ORTHO)) return true; break; }
    }
  }
  return false;
}
function inCheck(st, color){
  const k = findKing(st.b, color);
  if (k < 0) return false;
  return attacked(st.b, rowOf(k), colOf(k), other(color), st.u);
}
function mk(f, t, p, cap, extra){
  const m = { f, t, p, cap: cap || '', promo:'', ep:false, castle:'', dbl:false };
  if (extra){
    if (extra.promo)  m.promo  = extra.promo;
    if (extra.ep)     m.ep     = true;
    if (extra.castle) m.castle = extra.castle;
    if (extra.dbl)    m.dbl    = true;
  }
  return m;
}
function pseudoMoves(st){
  const { b, t } = st, u = st.u, out = [];
  for (let i = 0; i < 64; i++){
    const p = b[i];
    if (p === '' || colorOf(p) !== t) continue;
    const r = rowOf(i), c = colOf(i), up = p.toUpperCase();
    const pw = pwrAt(b, u, i);
    const lastRow = t === 'w' ? 0 : 7;
    const mark = out.length;                 // where this piece's moves begin

    /* A pawn promotes whenever it lands on the last rank, however it got there
       - including on a primitive it bought, which is the whole point of being
       able to give a pawn a knight's leap. */
    const push = (j, tgt) => {
      if ((pw & PW_PAWN) && rowOf(j) === lastRow)
        for (const q of 'QRBN') out.push(mk(i, j, p, tgt || '', {promo:q}));
      else out.push(mk(i, j, p, tgt || ''));
    };
    const slide = (dirs, once) => {
      for (const [dr,dc] of dirs){
        for (let rr = r+dr, cc = c+dc; onBoard(rr,cc); rr += dr, cc += dc){
          const j = rr*8+cc, tgt = b[j];
          if (tgt === '') push(j);
          else { if (colorOf(tgt) !== t) push(j, tgt); break; }
          if (once) break;
        }
      }
    };
    const leap = dirs => {                   // jumps: nothing in between matters
      for (const [dr,dc] of dirs){
        const rr = r+dr, cc = c+dc;
        if (!onBoard(rr,cc)) continue;
        const j = rr*8+cc, tgt = b[j];
        if (tgt === '' || colorOf(tgt) !== t) push(j, tgt);
      }
    };

    if (pw & PW_PAWN){
      const dir = t === 'w' ? -1 : 1;
      const startRow = t === 'w' ? 6 : 1;
      const r1 = r + dir;
      if (onBoard(r1,c) && b[r1*8+c] === ''){
        if (r1 === lastRow) for (const q of 'QRBN') out.push(mk(i, r1*8+c, p, '', {promo:q}));
        else {
          out.push(mk(i, r1*8+c, p));
          const r2 = r + 2*dir;
          if (r === startRow && b[r2*8+c] === '') out.push(mk(i, r2*8+c, p, '', {dbl:true}));
        }
      }
      for (const dc of [-1, 1]){
        const rr = r1, cc = c + dc;
        if (!onBoard(rr,cc)) continue;
        const j = rr*8+cc, tgt = b[j];
        if (tgt !== '' && colorOf(tgt) !== t){
          if (rr === lastRow) for (const q of 'QRBN') out.push(mk(i, j, p, tgt, {promo:q}));
          else out.push(mk(i, j, p, tgt));
        } else if (tgt === '' && j === st.ep){
          out.push(mk(i, j, p, t === 'w' ? 'p' : 'P', {ep:true}));
        }
      }
    }
    if (pw & PW_KNIGHT) leap(OFF_N);
    if (pw & PW_DIAG)   slide(OFF_B);
    if (pw & PW_ORTHO)  slide(OFF_R);
    if (pw & PW_STEP)   slide(OFF_K, true);
    if (pw & PW_ALFIL)  leap(OFF_A);
    if (pw & PW_DABBA)  leap(OFF_D);

    if (up === 'K'){
      const opp = other(t);
      const home = t === 'w' ? 60 : 4;
      if (i === home && !attacked(b, rowOf(home), colOf(home), opp, u)){
        const kSide = t === 'w' ? 'K' : 'k', qSide = t === 'w' ? 'Q' : 'q';
        const rook  = t === 'w' ? 'R' : 'r';

function hasPieces(st, side){
  const b = st.b;
  for (let i = 0; i < 64; i++){
    const p = b[i];
    if (p === '' || isWhitePiece(p) !== (side === 'w')) continue;
    const c = p.charCodeAt(0) | 32;
    if (c !== 112 && c !== 107) return true;     // anything but a pawn or a king
  }
  return false;
}

function negamax(st, depth, alpha, beta, ply){
  if (timeUp()) return 0;
  const check = inCheck(st, st.t);
  if (check) depth++;                            // check extension
  if (depth <= 0) return qsearch(st, alpha, beta);
  const me = st.t;

  if (!check && depth >= 3 && beta < MATE - 1000 && hasPieces(st, me)){
    const nu = makeNull(st);
    const sc = -negamax(st, depth - 3, -beta, -beta + 1, ply + 1);
    unmakeNull(st, nu);
    if (sStopped) return 0;
    if (sc >= beta) return beta;
  }

  const moves = orderMoves(pseudoMoves(st), ply);
  let legal = 0, best = -INF;
  for (const mv of moves){
    const undo = makeMove(st, mv);
    if (inCheck(st, me)){ unmakeMove(st, mv, undo); continue; }
    legal++;
    /* Late move reductions: the ordering puts captures, promotions and killers
       first, so a quiet move this far down the list is unlikely to be best.
       Search it shallower, and only pay for a full search if it surprises us. */
    let sc;
    const quiet = !mv.cap && !mv.promo && !check;
    if (quiet && legal > 3 && depth >= 3 && !inCheck(st, st.t)){
      sc = -negamax(st, depth - 2, -alpha - 1, -alpha, ply + 1);
      if (sc > alpha) sc = -negamax(st, depth - 1, -beta, -alpha, ply + 1);
    } else {
      sc = -negamax(st, depth - 1, -beta, -alpha, ply + 1);
    }
    unmakeMove(st, mv, undo);
    if (sStopped) return 0;
    if (sc > best) best = sc;
    if (sc > alpha) alpha = sc;
    if (alpha >= beta){ addKiller(mv, ply); break; }
  }
  if (!legal) return check ? -MATE + ply : 0;    // mate or stalemate
  return best;
}

/* Score EVERY legal move, best first. The weaker tiers need this: they play a
   deliberately imperfect move, which means knowing what every move is worth,
   not just what the best one is. It costs far more than a normal search
   because siblings cannot prune each other, so the top tiers use searchBest()
   instead - they only ever want the best move. */
function searchRoot(st, maxDepth, timeMs){
  sDeadline = performance.now() + (timeMs || 400);
  sStopped = false; sNodes = 0;
  KILL.length = 0;
  const legal = legalMoves(st);
  if (!legal.length) return { list: [], depth: 0, nodes: 0 };
  let list = legal.map(mv => ({ mv, san: toSAN(st, mv, legal), score: 0 }));
  let done = 0;
  for (let d = 1; d <= maxDepth; d++){
    const scored = [];
    for (const item of list){
      const undo = makeMove(st, item.mv);
      const sc = -negamax(st, d - 1, -INF, INF, 1);
      unmakeMove(st, item.mv, undo);
      if (sStopped) break;
      scored.push({ mv: item.mv, san: item.san, score: sc });
    }
    if (scored.length < list.length) break;      // ran out of time mid-iteration
    scored.sort((a, b) => b.score - a.score);
    list = scored; done = d;
    if (Math.abs(list[0].score) > MATE - 1000) break;
  }
  return { list, depth: done, nodes: sNodes };
}

/* Ordinary alpha-beta at the root: only the best move comes back, but it
   searches far deeper for the same time because siblings prune each other. */
function searchBest(st, maxDepth, timeMs){
  sDeadline = performance.now() + (timeMs || 400);
  sStopped = false; sNodes = 0; KILL.length = 0;
  const legal = legalMoves(st);
  if (!legal.length) return null;
  let bestMv = legal[0], bestScore = -INF, reached = 0;
  let order = legal.slice();
  for (let d = 1; d <= maxDepth; d++){
    let alpha = -INF, iterMv = null, iterScore = -INF;
    for (const mv of order){
      const undo = makeMove(st, mv);
      const sc = -negamax(st, d - 1, -INF, -alpha, 1);
      unmakeMove(st, mv, undo);
      if (sStopped) break;
      if (sc > alpha || iterMv === null){ alpha = sc; iterMv = mv; iterScore = sc; }
    }
    if (iterMv && !sStopped){
      bestMv = iterMv; bestScore = iterScore; reached = d;
      order = [bestMv].concat(order.filter(m => m !== bestMv));   // best first next time
    }
    if (sStopped) break;
    if (Math.abs(bestScore) > MATE - 1000) break;
  }
  return { mv: bestMv, san: toSAN(st, bestMv, legal), score: bestScore,
           depth: reached, nodes: sNodes };
}

/* ---- opponent strength ----
   Eight tiers, and the only thing that changes between them is how well the
   opponent plays. Nothing here hands it material or an upgrade: those are
   yours alone, so a round is won by outplaying it, not by out-scaling it.

   Weak levels are weak because of what they *choose*, not because they search
   badly - a near-random opponent is no fun and teaches nothing. Three knobs,
   each pulling in one direction only:
     maxLoss            how far below best an honest choice may fall
     spread             how often it takes the best of that honest pool
     slipChance/Min/Max how often it makes a human-sized error, and how big
   The slip band is deliberately independent of `maxLoss`. When they shared a
   bound, widening the honest pool also narrowed the blunder band, and the
   tiers stopped lining up in order of strength.

   The budgets are set from MEASURED cost, not guessed: full-width root search
   costs about 660ms at depth 3 and 2.5s at depth 4, and the narrow search the
   top two tiers use costs 2.1s at depth 5 and 5.3s at depth 6. Before this the
   middle tiers all asked for more depth than their clock could buy, so three
   supposedly different opponents were all quietly searching the same depth -
   which is exactly what a Stockfish match showed: tiers 5, 6 and 7 were
   indistinguishable. tests/search.test.js re-checks the ordering. */
const LEVELS = {
  1: { name:'Rookie',   depth:2, time:300,  spread:[30,35,35], maxLoss:220,
       slipChance:0.40, slipMin:220, slipMax:900 },
  2: { name:'Casual',   depth:2, time:450,  spread:[34,34,32], maxLoss:180,
       slipChance:0.30, slipMin:180, slipMax:700 },
  3: { name:'Improver', depth:3, time:900,  spread:[40,32,28], maxLoss:140,
       slipChance:0.21, slipMin:140, slipMax:560 },
  4: { name:'Club',     depth:3, time:1100, spread:[52,28,20], maxLoss:100,
       slipChance:0.14, slipMin:110, slipMax:440 },
  5: { name:'Solid',    depth:3, time:1400, spread:[68,22,10], maxLoss:60,
       slipChance:0.07, slipMin:90,  slipMax:330 },
  6: { name:'Sharp',    depth:4, time:3000, spread:[85,15],    maxLoss:35,
       slipChance:0.03, slipMin:70,  slipMax:220 },
  7: { name:'Expert',   depth:5, time:2800, best:true },
  8: { name:'Master',   depth:6, time:6000, best:true }
};

/* A phone blocks its only thread while searching, and its CPU is slower, so a
   2.2s budget there feels like a freeze. Shorten the clocks on touch devices:
   the bot loses a little depth, which matters far less than staying responsive. */
(function scaleForTouch(){
  const touch = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
  if (!touch) return;
  for (const k in LEVELS) LEVELS[k].time = Math.round(LEVELS[k].time * 0.6);
})();

/* Swappable so tests can seed it and get a deterministic ladder. */
let botRng = Math.random;
function setBotRng(fn){ botRng = fn || Math.random; }

function chooseBotMove(list, lvl){
  if (!list.length) return null;
  const L = LEVELS[lvl] || LEVELS[2];
  if (L.best) return list[0];
  const lossOf = x => list[0].score - x.score;
  /* An honest human-sized error. The band is its own pair of knobs rather than
     being pinned to `maxLoss`: when the two shared a bound, raising `maxLoss`
     widened the honest pool *and* narrowed the blunder band at the same time,
     so the tiers did not line up in order of strength. */
  if (botRng() < L.slipChance){
    const slips = list.filter(x => lossOf(x) >= L.slipMin && lossOf(x) <= L.slipMax);
    if (slips.length) return slips[Math.floor(botRng() * slips.length)];
  }
  const pool = list.filter(x => lossOf(x) <= L.maxLoss).slice(0, L.spread.length);
  if (!pool.length) return list[0];
  const w = L.spread.slice(0, pool.length);
  let r = botRng() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++){ r -= w[i]; if (r <= 0) return pool[i]; }
  return pool[0];
}
function botMove(st, lvl){
  const L = LEVELS[lvl] || LEVELS[2];
  if (L.best) return searchBest(st, L.depth, L.time);
  const r = searchRoot(st, L.depth, L.time);
  const pick = chooseBotMove(r.list, lvl);
  return pick ? { mv: pick.mv, san: pick.san, score: pick.score,
                  depth: r.depth, nodes: r.nodes } : null;
}

/* What is the opponent threatening right now? - their best capture if they
   were handed a free move. The single most useful thing to tell a beginner. */
function threatOf(st){
  if (inCheck(st, st.t)) return null;
  const flipped = { b: st.b, t: other(st.t), cast: st.cast, ep: -1, hm: st.hm, fm: st.fm };
  const w = worstLoss(flipped);
  return w.gain >= 2 ? w : null;
}
/* Material balance in pawns, from `side`'s point of view. */
function materialDiff(st, side){
  let d = 0;
  for (const p of st.b){
    if (p === '' || p.toUpperCase() === 'K') continue;
    d += (isWhitePiece(p) ? 1 : -1) * valOf(p);
  }
  return side === 'w' ? d : -d;
}

/* ---- how the game ended ---- */
function insufficientMaterial(b){
  const minors = [];
  for (let i = 0; i < 64; i++){
    const p = b[i]; if (p === '' || p.toUpperCase() === 'K') continue;
    const up = p.toUpperCase();
    if (up === 'P' || up === 'R' || up === 'Q') return false;
    minors.push({ up, white: p === up, dark: (rowOf(i) + colOf(i)) % 2 === 1 });
  }
  if (minors.length <= 1) return true;
  if (minors.length === 2 && minors[0].up === 'B' && minors[1].up === 'B' &&
      minors[0].white !== minors[1].white && minors[0].dark === minors[1].dark) return true;
  return false;
}
function positionKey(st){ return stateToFen(st).split(' ').slice(0, 4).join(' '); }
