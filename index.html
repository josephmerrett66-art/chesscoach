/* Decoded once into buffers and played through a shared gain node: a sample can
   then overlap itself (three coins in a row do not cut each other off) and the
   volume slider moves one value rather than sixteen. */
const sfxBuf = {};
let sfxGain = null, sfxReady = false;
async function loadSfx(){
  const ac = audio();
  if (!ac) return;
  sfxGain = ac.createGain();
  sfxGain.gain.value = sfxVol;
  sfxGain.connect(ac.destination);
  await Promise.all(Object.keys(SFX_SRC).map(async k => {
    try {
      const raw = atob(SFX_SRC[k]);
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      sfxBuf[k] = await ac.decodeAudioData(bytes.buffer);
    } catch(e){}
  }));
  sfxReady = true;
}
function setSfxVol(pct){
  sfxVol = Math.max(0, Math.min(1, pct / 100));
  try { localStorage.setItem('gauntlet.sfxvol', String(Math.round(sfxVol * 100))); } catch(e){}
  if (sfxGain) sfxGain.gain.value = sfxVol;
}
/* `rate` pitches the sample: the coin climbs as the grade improves, which is
   most of what makes a run of good moves feel like a run of good moves. */
function sfx(kind, rate, gain){
  if (!soundOn || !sfxReady) return;
  const ac = audio();
  if (!ac || !sfxBuf[kind]) return;
  try {
    const src = ac.createBufferSource();
    src.buffer = sfxBuf[kind];
    if (rate) src.playbackRate.value = rate;
    if (gain !== undefined){
      const g = ac.createGain();
      g.gain.value = gain;
      src.connect(g); g.connect(sfxGain);
    } else src.connect(sfxGain);
    src.start();
  } catch(e){}
}

/* ---- music ----------------------------------------------------------------
   One looping track, kept as a file beside the page rather than inlined: it is
   14MB, and base64 in the HTML would triple the parse cost of the whole game
   for a single asset. Browsers refuse to start audio until the player has
   interacted with the page, so the first pointer event anywhere kicks it off. */
const MUSIC_KEY = 'gauntlet.music.v1';
const MUSIC_SRC = 'assets/music/jungle-dnb.mp3';
let music = { on: true, vol: 0.4 };
try { music = Object.assign(music, JSON.parse(localStorage.getItem(MUSIC_KEY)) || {}); } catch(e){}
let musicEl = null;
function saveMusic(){ try { localStorage.setItem(MUSIC_KEY, JSON.stringify(music)); } catch(e){} }
function musicNode(){
  if (!musicEl){
    musicEl = new Audio(MUSIC_SRC);
    musicEl.loop = true;
  }
  musicEl.volume = music.vol;
  return musicEl;
}
function startMusic(){
  if (!music.on) return;
  musicNode().play().catch(() => {});   // still blocked: a later gesture retries
}
function setMusicOn(on){
  music.on = on; saveMusic();
  if (on) startMusic(); else if (musicEl) musicEl.pause();
  renderTheme();
}
function setMusicVol(pct){
  music.vol = Math.max(0, Math.min(1, pct / 100));
  saveMusic();
  if (musicEl) musicEl.volume = music.vol;
}
/* The first gesture is the one allowed to start audio, and it is also where the
   samples get decoded - doing it at boot would fight the sprite build. */
document.addEventListener('pointerdown', () => { startMusic(); loadSfx(); }, { once: true });

function moveSound(mv, after){
  if (mv.promo) sfx('promote');
  else if (mv.castle) sfx('castle');
  else if (mv.cap){
    // heavier pieces land harder: the same sample, pitched down and pushed
    const heft = VALUE[mv.cap.toUpperCase()] || 1;
    sfx('capture', Math.max(0.72, 1.15 - heft * 0.05), Math.min(1.4, 0.85 + heft * 0.07));
  }
  else sfx('move', 0.97 + Math.random() * 0.06);   // never twice identically
  if (inCheck(after, after.t)) sfx('check');
}

/* =========================================================================
   4. APP STATE
   ========================================================================= */
const A = {
  mode: 'play',                     // there is only one
  // seeded with a real position, never empty: setMode paints (via applyTheme)
  // before the first round is set up, and a render against an empty history
  // throws and takes the whole boot down with it
  states: [fenToState(START_FEN)], sans: [], moves: [], nodes: [], notes: [],
  cursor: 0,
  flip: false,
  sel: -1,
  hint: null,
  promo: null,
  thinking: false,
  gen: 0,
  playSide: 'w', level: 2, result: null,
  marks: [], review: [], analysis: null, hintData: null, hintBusy: false, fb2: null,
  coins: 0, coinFlash: 0, lastGrade: '', frozen: false,
  arcade: false, frozen: false, scanUntil: 0,
  fbCache: null
};
const curState  = () => A.states[A.cursor];
const curNode   = () => A.nodes[A.cursor];
const atEnd     = () => A.cursor === A.states.length - 1;
const yourSide  = () => A.playSide || 'w';
const yourTurn  = () => curState().t === yourSide();

function resetLine(){ A.fb2 = null; startGame(); }
/* Set when a move is played so the next render can slide the piece from its
   old square instead of teleporting it. */
let FX = null;
function pushMove(mv){
  const st = curState();
  const san = toSAN(st, mv);
  const slides = [{ f: mv.f, t: mv.t }];
  if (mv.castle){                                  // the rook travels too
    const row = colorOf(mv.p) === 'w' ? 56 : 0;
    slides.push(mv.castle === 'K' ? { f: row + 7, t: row + 5 }
                                  : { f: row, t: row + 3 });
  }
  FX = { slides, capture: mv.cap ? mv.t : -1, silent: !!A.dragDrop };
  A.dragDrop = false;
  const entry = null;                       // no opening book in the arcade
  A.states = A.states.slice(0, A.cursor + 1);
  A.sans   = A.sans.slice(0, A.cursor);
  A.moves  = A.moves.slice(0, A.cursor);
  A.notes  = A.notes.slice(0, A.cursor);
  A.nodes  = A.nodes.slice(0, A.cursor + 1);

  A.states.push(applyMove(st, mv));
  A.sans.push(san);
  A.moves.push(mv);
  A.notes.push(entry ? entry.n : null);
  A.nodes.push(entry ? (entry.k || null) : null);
  A.cursor = A.states.length - 1;
  A.sel = -1; A.hint = null;
  moveSound(mv, curState());
  if (A.runActive && colorOf(mv.p) === A.playSide) awardCoins(st, mv);
  if (A.arcade) setTimeout(() => arcadeMoveFx(mv, curState()), 60);
  return { san, entry, before: st };
}

/* =========================================================================
   5. BOARD RENDERING
   ========================================================================= */
const boardEl = byId('board');
const view = i => A.flip ? 63 - i : i;          // board index -> visual slot
const unview = i => A.flip ? 63 - i : i;
function slotStyle(i){
  const v = view(i);
  return 'transform:translate(' + (colOf(v) * 100) + '%,' + (rowOf(v) * 100) + '%)';
}
function posStyle(i){
  const v = view(i);
  return 'left:' + (colOf(v) * 12.5) + '%;top:' + (rowOf(v) * 12.5) + '%';
}
/* The frame carries the algebraic coordinates, so they have to follow the board
   when it is flipped. */
function paintCoords(){
  const f = byId('coordfiles'), r = byId('coordranks');
  if (!f || !r) return;
  const files = A.flip ? 'hgfedcba' : 'abcdefgh';
  const ranks = A.flip ? '12345678' : '87654321';
  f.innerHTML = [...files].map(c => '<span>' + c + '</span>').join('');
  r.innerHTML = [...ranks].map(c => '<span>' + c + '</span>').join('');
}
/* ---- the move trail --------------------------------------------------------
   The last move is shown as a line of small flames burning along the path the
   piece took, rather than an arrow drawn over the board. Flames are spaced by
   distance, not by square, so a one-square shuffle gets a couple and a long
   diagonal gets a proper streak; they thin out towards the square the piece
   left, so the trail reads in the right direction without an arrowhead.

   Each flame starts its loop at a different point, so the line flickers like
   fire instead of like eight copies of one animation. */
/* The last move is shown as a streak along the path the piece took: a soft
   bloom under a hard core, both fading out towards the square it left, so the
   trail reads in the right direction without needing an arrowhead. White for
   your moves, black for theirs - the same two colours as the pieces, which is
   all the legend it needs.

   It is one rotated element rather than something stepped square by square,
   which is what makes it read as a single streak. */
function trailHTML(from, to, mine){
  const a = view(from), b = view(to);
  const x0 = colOf(a) + 0.5, y0 = rowOf(a) + 0.5;
  const x1 = colOf(b) + 0.5, y1 = rowOf(b) + 0.5;
  const dist = Math.hypot(x1 - x0, y1 - y0);
  if (!dist) return '';
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const len = dist * 12.5;                                  // squares -> board %
  const ang = Math.atan2(y1 - y0, x1 - x0) * 180 / Math.PI;
  const pos = 'left:' + (cx / 8 * 100).toFixed(3) + '%;top:' + (cy / 8 * 100).toFixed(3) +
              '%;width:' + len.toFixed(3) + '%;--ang:' + ang.toFixed(2) + 'deg';
  return '<div class="trail ' + (mine ? 'mine' : 'theirs') + '">' +
           '<i class="scorch" style="' + pos + '"></i>' +
           '<i class="streak" style="' + pos + '"></i>' +
         '</div>';
}
function render(){
  const st = curState();
  const html = [];

  for (let i = 0; i < 64; i++){
    const v = view(i);
    const dark = (rowOf(i) + colOf(i)) % 2 === 1;
    let co = '';
    if (colOf(v) === 0) co += '<span class="co r">' + (8 - rowOf(i)) + '</span>';
    if (rowOf(v) === 7) co += '<span class="co f">' + FILES[colOf(i)] + '</span>';
    html.push('<div class="sqr ' + (dark ? 'd' : 'l') + '" data-sq="' + i + '" style="' +
              posStyle(i) + '">' + co + '</div>');
  }
  // last move
  const lastMv = A.cursor > 0 ? A.moves[A.cursor - 1] : null;
  if (lastMv){
    if (A.arcade && spritesReady){
      html.push(trailHTML(lastMv.f, lastMv.t, colorOf(lastMv.p) === A.playSide));
    } else {
      html.push('<div class="ov last" style="' + posStyle(lastMv.f) + '"></div>');
      html.push('<div class="ov last" style="' + posStyle(lastMv.t) + '"></div>');
    }
  }
  // check
  if (inCheck(st, st.t)){
    const k = findKing(st.b, st.t);
    if (k >= 0) html.push('<div class="ov chk" style="' + posStyle(k) + '"></div>');
  }
  // the piece currently open in the shop
  if (A.runActive && A.run && A.run.state === 'reward' && A.run.shopSel)
    html.push('<div class="ov sel" style="' + posStyle(idxOf(A.run.shopSel)) + '"></div>');
  // selection + destinations
  const canTake = {};                 // squares the picked-up piece may capture
  if (A.sel >= 0){
    html.push('<div class="ov sel" style="' + posStyle(A.sel) + '"></div>');
    for (const mv of legalMoves(st)){
      if (mv.f !== A.sel) continue;
      if (mv.cap && !mv.ep) canTake[mv.t] = 1;
      else html.push('<div class="dot" style="' + posStyle(mv.t) + '"></div>');
    }
  }
  // pieces
  for (let i = 0; i < 64; i++){
    const p = st.b[i];
    if (p === '') continue;
    const lifted = (i === A.sel) ? ' lift' : '';
    // a piece carrying something you bought is drawn gold, and says what it is
    const bought = (st.u && st.u[i]) || 0;
    const key = canTake[i] && spriteFor(p + '!') ? p + '!'
              : (bought && spriteFor(p + '+')) ? p + '+' : p;
    const art = (A.arcade && spritesReady && spriteFor(key))
      ? '<img src="' + spriteFor(key) + '" alt="">' : pieceSVG(p);
    const names = bought ? SHOP.filter(x => bought & x.bit).map(x => x.name) : null;
    const tip = names && names.length
      ? ' title="' + PIECE_NAME[p.toUpperCase()] + ' &mdash; ' + names.join(', ') + '"' : '';
    html.push('<div class="pc' + lifted + (bought ? ' up' : '') +
              (canTake[i] ? ' prey' : '') + '" data-sq="' + i + '"' +
              ' data-p="' + p.toUpperCase() + '"' + tip +
              ' style="' + slotStyle(i) + '">' + art + '</div>');
  }
  boardEl.innerHTML = html.join('');
  paintCoords();

  if (FX){
    // a piece dropped by hand is already where the finger left it, so sliding
    // it back to the origin first would look like a rubber band
    if (!FX.silent){
      for (const sl of FX.slides){
        const el = boardEl.querySelector('.pc[data-sq="' + sl.t + '"]');
        if (!el) continue;
        const v0 = view(sl.f);
        el.style.transition = 'none';
        el.style.transform = 'translate(' + (colOf(v0) * 100) + '%,' + (rowOf(v0) * 100) + '%)';
        void el.offsetWidth;                       // force the browser to take it
        el.style.transition = '';
        el.style.transform = slotStyle(sl.t).slice('transform:'.length);
      }
    }
    const land = boardEl.querySelector('.pc[data-sq="' + FX.slides[0].t + '"]');
    if (land){ land.classList.add('landed'); setTimeout(() => land.classList.remove('landed'), 260); }
    if (FX.capture >= 0){
      const fx = document.createElement('div');
      fx.className = 'fx take';
      fx.style.cssText = posStyle(FX.capture);
      fx.innerHTML = '<i></i>';
      boardEl.appendChild(fx);
      setTimeout(() => fx.remove(), 460);
    }
    FX = null;
  }
  // a mated king falls over
  if (A.result && A.result.why === 'checkmate'){
    const loser = A.result.res === '1-0' ? 'b' : 'w';
    const k = findKing(st.b, loser);
    const el = k >= 0 && boardEl.querySelector('.pc[data-sq="' + k + '"]');
    if (el) el.classList.add('dead');
  }
  if (A.promo) renderPromo();
  boardEl.classList.toggle('locked', !interactive());
  renderSide();
}
function renderPromo(){
  const me = curState().t;
  const opts = ['Q','R','B','N'].map(q =>
    '<button data-promo="' + q + '">' + pieceSVG(me === 'w' ? q : q.toLowerCase()) + '</button>').join('');
  boardEl.insertAdjacentHTML('beforeend',
    '<div class="promo"><div class="opts">' + opts + '</div></div>');
}
function interactive(){
  if (A.promo) return true;
  if (A.thinking) return false;
  if (A.mode === 'learn') return false;
  if (!atEnd()) return false;
  if (A.mode === 'play') return !A.result && curState().t === A.playSide;
  if (A.mode === 'train') return yourTurn();
  return true;                                   // free play: move both sides
}

/* =========================================================================
   6. INPUT (click + drag)
   ========================================================================= */
function squareAt(clientX, clientY){
  if (A.arcade && theme.tilt){
    // the board is rotated, so rect arithmetic no longer maps to squares
    const el = document.elementFromPoint(clientX, clientY);
    const hit = el && el.closest ? el.closest('[data-sq]') : null;
    return hit ? Number(hit.dataset.sq) : -1;
  }
  const r = boardEl.getBoundingClientRect();
  const c = Math.floor((clientX - r.left) / (r.width / 8));
  const rr = Math.floor((clientY - r.top) / (r.height / 8));
  if (c < 0 || c > 7 || rr < 0 || rr > 7) return -1;
  return unview(rr * 8 + c);
}
let drag = null;
boardEl.addEventListener('pointerdown', e => {
  if (A.promo){
    const btn = e.target.closest('[data-promo]');
    if (btn){ completePromo(btn.dataset.promo); }
    return;
  }
  /* Between rounds the board is the shop counter: tapping one of your own
     pieces picks it, and the panel below prices what it can still be given. */
  if (A.runActive && A.run && A.run.state === 'reward'){
    const s2 = squareAt(e.clientX, e.clientY);
    if (s2 < 0) return;
    const q = curState().b[s2];
    if (q !== '' && colorOf(q) === A.playSide){
      A.run.shopSel = nameOf(s2);
      sfx('select', 1.1);
      saveRun(); render();
    }
    return;
  }
  if (!interactive()) return;
  const sq = squareAt(e.clientX, e.clientY);
  if (sq < 0) return;
  const st = curState();
  const p = st.b[sq];

  if (A.sel >= 0 && A.sel !== sq){
    if (tryMove(A.sel, sq)) return;
  }
  if (p !== '' && colorOf(p) === st.t){
    A.sel = sq;
    render();
    const el = boardEl.querySelector('.pc[data-sq="' + sq + '"]');
    if (el){
      const r = boardEl.getBoundingClientRect();
      drag = { sq, el, r, w: r.width / 8, ox: e.clientX, oy: e.clientY, moved: false };
      sfx('select');
      el.classList.add('drag');
      boardEl.setPointerCapture(e.pointerId);
    }
  } else {
    A.sel = -1; render();
  }
});
boardEl.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.ox, dy = e.clientY - drag.oy;
  if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  if (A.arcade && theme.tilt){
    // on a tilted board a pixel offset does not correspond to a distance, so
    // the piece hops from square to square under the finger instead
    const sq = squareAt(e.clientX, e.clientY);
    if (sq >= 0){
      const v2 = view(sq);
      drag.el.style.transform = 'translate(' + (colOf(v2) * 100) + '%,' + (rowOf(v2) * 100) + '%)';
    }
    return;
  }
  const v = view(drag.sq);
  drag.el.style.transform =
    'translate(' + (colOf(v) * drag.w + dx) + 'px,' + (rowOf(v) * drag.w + dy) + 'px)';
});
boardEl.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  d.el.classList.remove('drag');
  if (!d.moved){ return; }               // treat as a click-select, keep selection
  A.dragDrop = true;                     // it is already under the finger
  const sq = squareAt(e.clientX, e.clientY);
  if (sq < 0 || sq === d.sq){ render(); return; }
  if (!tryMove(d.sq, sq)) render();
});
boardEl.addEventListener('pointercancel', () => { if (drag){ drag = null; render(); } });

function tryMove(from, to){
  const st = curState();
  const cands = legalMoves(st).filter(m => m.f === from && m.t === to);
  if (!cands.length) return false;
  if (cands.length > 1 && cands[0].promo){
    A.promo = { from, to };
    render();
    return true;
  }
  playUser(cands[0]);
  return true;
}
function completePromo(q){
  const { from, to } = A.promo;
  A.promo = null;
  const mv = legalMoves(curState()).find(m => m.f === from && m.t === to && m.promo === q);
  if (mv) playUser(mv); else render();
}

/* =========================================================================
   7. PLAYING A MOVE + COACHING
   ========================================================================= */
function playUser(mv){ playUserMove(mv); }

/* ---- the coach ---- */
const PIECE_NAME = { P:'pawn', N:'knight', B:'bishop', R:'rook', Q:'queen', K:'king',
                     A:'archbishop', C:'chancellor', M:'amazon' };

/* =========================================================================
   8. SIDE PANEL
   ========================================================================= */
function setFeedback(kind, title, text){
  const el = byId('fb');
  el.className = 'fb ' + kind;
  el.querySelector('.ic').textContent = kind === 'good' ? '✓' : kind === 'bad' ? '✕'
                                       : kind === 'warn' ? '!' : 'i';
  byId('fbti').innerHTML = title;
  byId('fbtx').innerHTML = text || '';
}
/* The second card. In Play mode the top card holds the verdict on YOUR move and
   stays put; this one holds what is happening now - their reply, or a hint.
   Without it the coaching on your own move was on screen for about 400ms before
   the opponent's reply overwrote it. */
function setFeedback2(fb){
  const el = byId('fb2');
  if (!fb){ el.style.display = 'none'; return; }
  el.style.display = '';
  el.className = 'fb ' + fb.kind;
  el.querySelector('.ic').textContent = fb.kind === 'good' ? '✓' : fb.kind === 'bad' ? '✕'
                                       : fb.kind === 'warn' ? '!' : 'i';
  byId('fb2ti').innerHTML = fb.title;
  byId('fb2tx').innerHTML = fb.text || '';
}
function renderSide(){
  if (A.fbCache) setFeedback(A.fbCache.kind, A.fbCache.title, A.fbCache.text);
  setFeedback2(A.fb2);
  /* The board and input matter more than the HUD: if a panel throws, report it
     in the build stamp rather than aborting the whole render. */
  try { renderArcade(); renderTheme(); }
  catch (err){ hudError = String(err && err.message || err); }
  renderCaptures();
  renderPowers();
}

/* One mode. setMode survives as the single entry point into a run because the
   run is still an ordinary game with a run wrapped round it. */
function setMode(){
  A.runActive = true;
  A.arcade = true;
  // Create the run BEFORE anything paints. applyTheme() renders, and on a first
  // visit there is no saved run, so rendering first threw and took the whole
  // arcade down - HUD, overlay and sprite build with it.
  if (!A.run) loadRun();
  if (!A.run) newRun();
  if (A.run.state === 'playing') A.run.state = 'ready';
  A.mode = 'play';
  document.body.classList.add('arcade', 'mode-play');
  applyTheme(false);
  if (!spritesReady) buildSprites();
  resetLine();
}
byId('btnflip').onclick = () => { A.flip = !A.flip; render(); };
function paintSoundBtn(){
  byId('btnsound').innerHTML = soundOn ? '&#128266;' : '&#128263;';
  byId('btnsound').style.opacity = soundOn ? '1' : '.5';
}
/* One place flips the effects switch, so the header button and the Settings
   toggle can never disagree about which way it is set. */
function toggleSound(){
  soundOn = !soundOn;
  try { localStorage.setItem('gauntlet.sound', soundOn ? 'on' : 'off'); } catch(e){}
  paintSoundBtn();
  if (soundOn) sfx('select');
}
byId('btnsound').onclick = () => { toggleSound(); renderTheme(); };
paintSoundBtn();
/* The run owns every control, so the only global wiring left is the take-back
   (bought as an upgrade) and the two keys worth having on a keyboard. */
function doTakeBack(){
  A.gen++;                                        // cancel any pending bot move
  const back = (curState().t === A.playSide) ? 2 : 1;
  A.cursor = Math.max(0, A.cursor - back);
  A.states = A.states.slice(0, A.cursor + 1);
  A.sans   = A.sans.slice(0, A.cursor);
  A.moves  = A.moves.slice(0, A.cursor);
  A.notes  = A.notes.slice(0, A.cursor);
  A.nodes  = A.nodes.slice(0, A.cursor + 1);
  A.marks  = A.marks.slice(0, A.cursor);
  A.review = A.review.filter(r => r.ply <= A.cursor);
  A.result = null; A.analysis = null; A.thinking = false;
  A.fb2 = null;
  arcSay('<b>Taken back.</b> Have another go at that move.');
  render();
  if (curState().t !== A.playSide) scheduleBot(400);
  else startClock();
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.metaKey || e.ctrlKey) return;
  if (e.key === 'f' || e.key === 'F'){ A.flip = !A.flip; render(); }
});


/* =========================================================================
   12. PLAY A GAME  (opponent + move-by-move coaching)
   ========================================================================= */


function gameResult(){
  const st = curState();
  if (!legalMoves(st).length)
    return inCheck(st, st.t)
      ? { over:true, res: st.t === 'w' ? '0-1' : '1-0', why:'checkmate' }
      : { over:true, res:'1/2-1/2', why:'stalemate' };
  if (st.hm >= 100) return { over:true, res:'1/2-1/2', why:'the fifty-move rule' };
  if (insufficientMaterial(st.b)) return { over:true, res:'1/2-1/2', why:'insufficient material' };
  const k = positionKey(st);
  let n = 0;
  for (let i = 0; i <= A.cursor; i++) if (positionKey(A.states[i]) === k) n++;
  if (n >= 3) return { over:true, res:'1/2-1/2', why:'threefold repetition' };
  return { over:false };
}

/* ---- starting and running a game ---- */
function startGame(){
  A.gen++;
  A.playSide = 'w';                       // the run is always played as White
  A.level = roundLevel();
  A.states = [gauntletBoard()];
  A.sans = []; A.moves = []; A.notes = []; A.nodes = [null];
  A.marks = []; A.review = [];
  A.cursor = 0; A.sel = -1; A.hint = null; A.promo = null;
  A.result = null; A.analysis = null; A.thinking = false;
  A.fb2 = null;
  A.coinFlash = 0; A.lastGrade = ''; A.forced = false; A.frozen = false;
  A.flip = (A.playSide === 'b');
  A.fbCache = null;
  render();
  if (A.arcade)
    arcSay('<b>Round ' + Math.min(A.run.round + 1, ROUNDS.length) + '.</b> Opponent: <b>' +
      LEVELS[A.level].name.toUpperCase() + '</b> &mdash; ' +
      coinRate(A.level).toFixed(1) + '&times; coins. <b>30s a move.</b>');
  if (curState().t !== A.playSide) scheduleBot(500);
  else startClock();
}
function scheduleBot(ms){
  A.thinking = true;
  stopClock();                      // their turn: the pressure is off
  A.fb2 = { kind:'info', title:'<span class="think"></span>Thinking&hellip;',
            text:'Level ' + A.level + ' (' + LEVELS[A.level].name + ') is choosing a reply.' };
  const gen = A.gen;
  render();
  setTimeout(() => { if (gen === A.gen) botPlay(); }, ms);
}
function botPlay(){
  if (A.mode !== 'play' || A.result || curState().t === A.playSide){
    A.thinking = false; render(); return;
  }
  const st = curState();
  let chosen = null;
  if (A.frozen){                                   // bought with Scramble
    A.frozen = false;
    const legal = legalMoves(st);
    const pick = legal[Math.floor(Math.random() * legal.length)];
    chosen = { mv: pick, san: toSAN(st, pick) };
  }
  if (!chosen){
    const r = botMove(st, A.level);
    if (!r){ A.thinking = false; finishGame(); return; }
    chosen = r;
  }
  A.thinking = false;
  pushMove(chosen.mv);
  A.marks.push(null);
  const st2 = curState();
  const over = gameResult();
  if (over.over){ render(); finishGame(over); return; }

  /* The only running commentary the game keeps: what just happened to you.
     Not coaching - you get no advice on what to do about it. */
  const threat = threatOf(st2);
  const checked = inCheck(st2, st2.t);
  const bad = checked ? 'CHECK. ' : (threat ? 'THEY THREATEN YOUR ' +
    PIECE_NAME[(threat.piece || 'P').toUpperCase()].toUpperCase() + ' ON ' +
    nameOf(threat.sq).toUpperCase() + '. ' : '');
  arcSay('<b>' + chosen.san + '</b> &mdash; ' + (bad ||
    (chosen.mv.cap ? 'They took your ' + PIECE_NAME[chosen.mv.cap.toUpperCase()] + '. '
                   : 'Your move.')));
  render();
  startClock();                     // back to you, and the clock knows it
}



/* Squares the enemy pieces currently giving check are standing on. */
function checkersOf(st){
  const k = findKing(st.b, st.t);
  if (k < 0) return [];
  const flipped = { b: st.b, t: other(st.t), cast:'', ep:-1, hm:0, fm:1 };
  return pseudoMoves(flipped).filter(m => m.t === k).map(m => m.f);
}





/* Captured pieces, taken from the move list so promotions and en passant
   cannot throw the count off. */
function capturedLists(){
  const order = { Q:0, R:1, B:2, N:3, P:4 };
  const w = [], b = [];
  for (let i = 0; i < A.cursor; i++){
    const m = A.moves[i];
    if (!m || !m.cap) continue;
    (colorOf(m.p) === 'w' ? w : b).push(m.cap);
  }
  const sort = a => a.sort((x, y) => order[x.toUpperCase()] - order[y.toUpperCase()]);
  return { w: sort(w), b: sort(b) };
}
function renderCaptures(){
  const { w, b } = capturedLists();
  const diff = materialDiff(curState(), 'w');        // positive means White is up
  if (A.arcade){
    const el = byId('arccaps');
    if (el){
      const mine = A.playSide === 'w' ? w : b;       // what you have taken
      const theirs = A.playSide === 'w' ? b : w;
      const adv = A.playSide === 'w' ? diff : -diff;
      const strip = (list, label, score) =>
        '<div class="caprow' + (list.length ? '' : ' none') + '"><em>' + label + '</em>' +
        (list.length
          ? list.map(p => '<img src="' + (spriteFor(p) || '') + '" alt="">').join('')
          : '<i>nothing yet</i>') +
        (score > 0 ? '<b>+' + score + '</b>' : '') + '</div>';
      el.innerHTML = strip(mine, 'You', adv) + strip(theirs, 'Them', -adv);
    }
    return;
  }
  const strip = (list, adv) =>
    list.map(p => '<i>' + pieceSVG(p) + '</i>').join('') +
    (adv > 0 ? '<b>+' + adv + '</b>' : '');
  // each strip belongs to the player sitting on that side of the board
  const topIsWhite = A.flip;
  byId('capTop').innerHTML = topIsWhite ? strip(w,  diff) : strip(b, -diff);
  byId('capBot').innerHTML = topIsWhite ? strip(b, -diff) : strip(w,  diff);
}


function playUserMove(mv){
  stopClock();
  const r = pushMove(mv);
  A.marks.push('');
  A.review.push({ ply: A.cursor, san: r.san, mark: '' });
  A.fbCache = null; A.fb2 = null;
  // awardCoins has already said what the move was worth; do not talk over it
  render();
  const over = gameResult();
  if (over.over){ finishGame(over); return; }
  scheduleBot(420);
}

function finishGame(over){
  over = over || gameResult();
  A.result = over;
  A.thinking = false;
  stopClock();
  const youWonSfx = (over.res === '1-0' && A.playSide === 'w') ||
                    (over.res === '0-1' && A.playSide === 'b');
  sfx(youWonSfx ? 'win' : 'lose');            // a draw ends a run like a loss
  // name the move it ended on, and make sure no stale "Thinking..." card is left
  A.fb2 = A.sans.length
    ? { kind:'info', title:'Final move: ' + A.sans[A.sans.length - 1],
        text:'Click any move above to step back through the game and see where it turned.' }
    : null;
  const youWon = (over.res === '1-0' && A.playSide === 'w') ||
                 (over.res === '0-1' && A.playSide === 'b');
  const drawn = over.res === '1/2-1/2';
  A.fbCache = {
    kind: drawn ? 'info' : (youWon ? 'good' : 'bad'),
    title: drawn ? 'Drawn by ' + over.why
                 : (youWon ? 'You won by ' + over.why : 'You lost by ' + over.why),
    text: drawn ? 'A draw. Have a look at the review below to see where the game turned.'
                : (youWon ? 'Well played. The review below shows which of your moves were the ' +
                            'best ones, and where you got lucky.'
                          : 'The review below shows exactly where it went wrong. Losing games ' +
                            'is how everybody learns this &mdash; just make sure you find out why.')
  };
  if (A.runActive && A.run){
    gauntletFinished(over);
    // the arcade overlay shows the offer; there is no side panel to fill
  }
  render();
}


/* =========================================================================
   13. GAUNTLET  (the roguelike run)
   ------------------------------------------------------------------------
   Eight rounds against a bot that gets stronger every time. Win one and you
   pick an upgrade, which is applied to your starting position for the rest of
   the run. The upgrades compound; the question is whether they compound faster
   than the opponent improves.
   ========================================================================= */
/* ---- the run ---------------------------------------------------------------
   Eight rounds against an opponent that gets stronger every round. You are not
   handed upgrades for winning: you earn coins for the *quality of your moves*,
   and between rounds you spend them in a shop that upgrades individual pieces.

   That swap is the whole design. Rewarding captures rewards grabbing material,
   which a beginner does anyway; rewarding good moves rewards finding the right
   move in the position in front of you - and paying out more against a stronger
   opponent means the hard rounds are also the ones that fund you. */
const ROUNDS = [
  { level:1 }, { level:2 }, { level:3 }, { level:4 },
  { level:5 }, { level:6 }, { level:7 }, { level:8 }
];
/* Chosen before a run starts and locked for its duration: a pure offset into
   the strength ladder, nothing else. */
const DIFFS = [
  { name:'Gentle', lvl:-2, blurb:'Rookie up to Sharp. Fewer coins, but room to learn.' },
  { name:'Normal', lvl:0,  blurb:'Rookie up to Master across the eight rounds.' },
  { name:'Hard',   lvl:2,  blurb:'Opens at Improver, tops out at Master by round six.' },
  { name:'Brutal', lvl:4,  blurb:'Opens at Solid. Master from round four - and pays for it.' }
];
const runDiff = () => DIFFS[(A.run && A.run.diff) || 0] || DIFFS[1];

/* ---- what the shop sells ---------------------------------------------------
   One movement primitive at a time, bought for one specific piece. Prices track
   what the primitive is actually worth on the board (see PW_CP), marked up so
   that a rook's slide costs real money and a two-square leap is an impulse buy.

   Pieces are identified by the square they START on, because every round begins
   from the opening position - "the pawn on e2" is a thing that exists in every
   round of the run, whereas "that pawn over there" is not. */
const SHOP = [
  { bit:PW_ALFIL,  name:'Longbow',  cost:40,
    desc:'Also leaps two squares diagonally, jumping whatever is in between.' },
  { bit:PW_DABBA,  name:'Charge',   cost:40,
    desc:'Also leaps two squares straight, jumping whatever is in between.' },
  { bit:PW_STEP,   name:'Footwork', cost:70,
    desc:'Also steps one square in any direction, like a king.' },
  { bit:PW_KNIGHT, name:'Outrider', cost:100,
    desc:'Also moves as a knight.' },
  { bit:PW_DIAG,   name:'Diagonals', cost:110,
    desc:'Also slides any distance diagonally, like a bishop.' },
  { bit:PW_ORTHO,  name:'Lines',    cost:150,
    desc:'Also slides any distance in straight lines, like a rook.' }
];
/* A piece already doing something should not be sold it twice, and the king is
   left alone - giving it more ways to move mostly means more ways to be mated. */
function shopFor(sq){
  const st = fenToState(START_FEN);
  const p = st.b[idxOf(sq)];
  if (!p || p !== p.toUpperCase()) return [];
  const have = (BASE_PW[p] || 0) | ownedAt(sq);
  return SHOP.filter(x => !(have & x.bit));
}
const ownedAt = sq => (A.run && A.run.pieces && A.run.pieces[sq]) || 0;

const RUN_KEY = 'gauntlet.run.v2';
function saveRun(){ try { localStorage.setItem(RUN_KEY, JSON.stringify(A.run)); } catch(e){} }
function loadRun(){
  try { A.run = JSON.parse(localStorage.getItem(RUN_KEY)) || null; } catch(e){ A.run = null; }
}
function newRun(){
  const keep = (A.run && typeof A.run.diff === 'number') ? A.run.diff : 1;
  A.run = { round: 0, pieces: {}, coins: 0, earned: 0, state: 'ready',
            best: 0, shopSel: null, diff: keep };
  saveRun();
}
function setDiff(i){
  if (!A.run || A.run.round > 0 || A.run.state === 'playing') return;   // locked once started
  A.run.diff = i; saveRun(); render();
}

/* Your starting position, with everything you have bought attached to the
   squares those pieces start on. The opponent's side is never touched. */
function gauntletBoard(){
  const st = fenToState(START_FEN);
  st.u = new Array(64).fill(0);
  const owned = (A.run && A.run.pieces) || {};
  for (const sq in owned) st.u[idxOf(sq)] = owned[sq];
  return st;
}
/* The board you shop on. The opponent is swept off it: their half is where the
   upgrades are drawn, and an empty rank reads far better under a panel than
   eight pieces you are not buying anything for. */
function shopBoard(){
  const st = gauntletBoard();
  for (let i = 0; i < 64; i++)
    if (st.b[i] !== '' && st.b[i] === st.b[i].toLowerCase()) st.b[i] = '';
  return st;
}
function roundBase(){ return ROUNDS[A.run.round] || ROUNDS[ROUNDS.length - 1]; }
function roundLevel(){
  return Math.max(1, Math.min(8, roundBase().level + runDiff().lvl));
}

/* ---- coins ----------------------------------------------------------------
   Paid on how good the move was, measured the way the trainer graded moves: how
   much worse than the best available it left you, in centipawns. The search is
   deliberately shallow - it only has to tell a good move from a poor one, and a
   deep one here would put a visible pause after every move you make. */
const COIN_BANDS = [
  { loss:15,  coins:5, word:'Best' },
  { loss:50,  coins:3, word:'Strong' },
  { loss:120, coins:2, word:'Solid' },
  { loss:280, coins:1, word:'Loose' }
];
const GRADE_DEPTH = 3, GRADE_MS = 220;
/* A stronger opponent pays better, so the rounds that are hardest to survive
   are also the ones that fund the upgrades you need for the next one. */
const coinRate = lvl => 1 + (lvl - 1) * 0.3;
function awardCoins(before, mv){
  if (!A.runActive || !A.run || colorOf(mv.p) !== A.playSide) return;
  const r = searchRoot(before, GRADE_DEPTH, GRADE_MS);
  if (!r.list.length) return;
  const best = r.list[0].score;
  const mine = r.list.find(x => x.mv.f === mv.f && x.mv.t === mv.t &&
                                x.mv.promo === mv.promo);
  const loss = Math.max(0, best - (mine ? mine.score : best));
  const band = COIN_BANDS.find(b => loss <= b.loss);
  const got = band ? Math.round(band.coins * coinRate(A.level)) : 0;
  A.run.coins += got;
  A.run.earned += got;
  A.coinFlash = got;
  A.lastGrade = band ? band.word : 'Blunder';
  /* Balatro's trick: the reward escalates audibly. The coin climbs a step per
     band, and the top band gets its own sting on top of it. */
  const tier = band ? COIN_BANDS.indexOf(band) : -1;
  if (tier < 0) sfx('blunder');
  else {
    sfx(got > 8 ? 'coinbig' : 'coin', [1.42, 1.24, 1.1, 1.0][tier]);
    if (tier === 0) setTimeout(() => sfx('best', 1, 0.8), 70);
  }
  if (A.arcade && got){
    const at = mv.t;
    floatText(at, '+' + got, tier === 0 ? '#ffe27a' : '#ffc93f');
    burst(at, '#ffc93f', 4 + (4 - Math.max(tier, 0)) * 3, 1.6 + (3 - Math.max(tier, 0)) * 0.5);
    if (tier === 0) shake(140, 3);
  }
  const forced = A.forced; A.forced = false;
  arcSay((forced ? '<b>OUT OF TIME &mdash; played for you.</b> ' : '') +
         '<b>' + toSAN(before, mv) + ' &mdash; ' + A.lastGrade + '.</b>' +
         (got ? ' +' + got + ' coin' + (got === 1 ? '' : 's') + '.'
              : ' No coins for that one.'));
  saveRun();
}

/* ---- the move clock -------------------------------------------------------
   Thirty seconds a move. Run out and a random legal move is played for you,
   which is almost always worse than anything you would have chosen - so the
   pressure is real without the game ever taking the round away from you
   outright. It only runs on your turn: it stops while the opponent thinks, in
   the shop, and once the round is over. */
const MOVE_SECONDS = 30;
let clockUntil = 0, clockRaf = 0, clockLastBeep = -1;
function clockRunning(){
  return A.runActive && A.run && A.run.state === 'playing' &&
         !A.result && !A.thinking && curState().t === A.playSide;
}
function clockLeft(){
  return Math.max(0, (clockUntil - performance.now()) / 1000);
}
function startClock(){
  clockUntil = performance.now() + MOVE_SECONDS * 1000;
  clockLastBeep = -1;
  clockPaused = 0;
  paintClock();                     // show the full clock now, not next frame
  if (!clockRaf) clockRaf = requestAnimationFrame(tickClock);
}
/* The clock is driven by requestAnimationFrame, which the browser suspends on a
   hidden tab. Left alone that means switching away mid-move freezes the clock
   and then times you out the instant you come back. Bank the remaining time
   instead and hand it back on return. */
let clockPaused = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    if (!clockUntil) return;
    clockPaused = clockLeft();
    clockUntil = 0;
    if (clockRaf){ cancelAnimationFrame(clockRaf); clockRaf = 0; }
  } else if (clockPaused > 0){
    clockUntil = performance.now() + clockPaused * 1000;
    clockPaused = 0;
    paintClock();
    if (!clockRaf) clockRaf = requestAnimationFrame(tickClock);
  }
});
function stopClock(){
  clockUntil = 0; clockPaused = 0;
  if (clockRaf){ cancelAnimationFrame(clockRaf); clockRaf = 0; }
  paintClock();
}
function tickClock(){
  clockRaf = 0;
  if (!clockRunning() || !clockUntil){ paintClock(); return; }
  const left = clockLeft();
  paintClock();
  /* One beep a second under ten, climbing in pitch. The last three are the
     loud ones - that is the bit that actually makes you move. */
  const whole = Math.ceil(left);
  if (left <= 10 && whole !== clockLastBeep){
    clockLastBeep = whole;
    if (whole > 0) sfx(whole <= 3 ? 'warn' : 'tick', 1 + (10 - whole) * 0.045,
                       whole <= 3 ? 1 : 0.7);
  }
  if (left <= 0){ clockExpired(); return; }
  clockRaf = requestAnimationFrame(tickClock);
}
function paintClock(){
  const bar = byId('clockbar'), fill = byId('clockfill'), num = byId('clocknum');
  if (!bar || !fill) return;
  if (!clockRunning() || !clockUntil){
    /* An empty track, not a full one: between turns there is no time running,
       and a full bar reads as thirty seconds still on the board. */
    bar.className = 'clockbar';
    fill.style.width = '0%';
    if (num) num.textContent = '';
    const w0 = byId('boardwrap');
    if (w0) w0.classList.remove('panic');
    return;
  }
  const left = clockLeft();
  fill.style.width = (left / MOVE_SECONDS * 100).toFixed(2) + '%';
  // the number only appears once it matters, so the bar stays the main signal
  if (num) num.textContent = left <= 10 ? left.toFixed(1) : '';
  bar.className = 'clockbar on' + (left <= 5 ? ' crit' : left <= 10 ? ' warn' : '');
  const w = byId('boardwrap');
  if (w) w.classList.toggle('panic', left <= 5);
}
/* Out of time: a random legal move, announced loudly enough that you know the
   game did it and not you. */
function clockExpired(){
  stopClock();
  if (!A.runActive || A.result || A.thinking) return;
  if (!A.run || A.run.state !== 'playing') return;
  const st = curState();
  if (st.t !== A.playSide) return;
  const legal = legalMoves(st);
  if (!legal.length) return;
  const mv = legal[Math.floor(Math.random() * legal.length)];
  sfx('timeout');
  shake(420, 10);
  /* awardCoins narrates every move you make, and it runs inside playUser - so
     flag the move rather than announcing it here, or the grade line lands on
     top of the notice and you never learn the game moved for you. */
  A.forced = true;
  playUser(mv);
}

/* ---- powers -----------------------------------------------------------------
   Bought mid-round with the SAME coins the shop spends. That is the whole point
   of the price: every coin you burn getting out of trouble now is a coin not
   spent on a permanent upgrade between rounds, so a Redo has to be worth more
   to you than most of a knight's leap. Both cost more than the cheapest upgrade
   on purpose - if they were cheap they would not be a decision. */
const POWERS = [
  { id:'redo',     name:'Redo',     cost:60,
    desc:'Take back your last move and their reply.' },
  { id:'scramble', name:'Scramble', cost:90,
    desc:'Their next move is picked at random instead of played well.' }
];
const powerById = id => POWERS.find(p => p.id === id);
function canAfford(p){ return !!A.run && A.run.coins >= p.cost; }
function usePower(id){
  const p = powerById(id);
  if (!p || !A.runActive || !A.run || A.run.state !== 'playing') return;
  if (A.result || A.thinking || curState().t !== A.playSide){ sfx('deny'); return; }
  if (id === 'redo' && A.cursor < 2){ sfx('deny'); return; }
  if (id === 'scramble' && A.frozen){ sfx('deny'); return; }
  if (!canAfford(p)){
    sfx('deny');
    arcSay('<b>' + p.name + '</b> costs <b>' + p.cost + '</b> coins and you have <b>' +
           A.run.coins + '</b>.');
    return;
  }
  A.run.coins -= p.cost;
  saveRun();
  sfx('buy');
  if (id === 'redo'){
    doTakeBack();                       // says its own line and restarts the clock
  } else {
    A.frozen = true;
    arcSay('<b>Scrambled.</b> Their next move is a random one &mdash; make it count.');
    render();
  }
}
function renderPowers(){
  const bar = byId('powerbar');
  if (!bar) return;
  if (!A.runActive || !A.run || A.run.state !== 'playing' || A.result){
    bar.style.display = 'none'; return;
  }
  bar.style.display = '';
  const myTurn = curState().t === A.playSide && !A.thinking && !A.result;
  bar.innerHTML = POWERS.map(p => {
    const armed = p.id === 'scramble' && A.frozen;
    const ready = myTurn && !armed && canAfford(p) &&
                  (p.id !== 'redo' || A.cursor >= 2);
    return '<button class="pbtn" data-pow="' + p.id + '"' + (ready ? '' : ' disabled') +
      ' title="' + p.desc.split('"').join('') + '">' +
      (armed ? 'Scramble armed' : p.name) + '<i>' + p.cost + '</i></button>';
  }).join('');
  bar.querySelectorAll('[data-pow]').forEach(b =>
    b.onclick = () => usePower(b.dataset.pow));
}

function startGauntletRound(){
  A.runActive = true;
  A.run.state = 'playing';
  A.run.shopSel = null;
  startFx();
  if (A.run.round > A.run.best) A.run.best = A.run.round;   // furthest round reached
  saveRun();
  startGame();
}
function gauntletFinished(over){
  const youWon = over.res === '1-0';                 // you are always White in a run
  A.run.state = youWon ? 'reward' : 'dead';
  A.run.shopSel = null;
  saveRun();
  /* The shop counter is the board itself, so put your own lineup back on it -
     with everything bought so far already fitted, which is also the clearest
     way to show what your money has actually done. */
  if (youWon) setTimeout(() => sfx('shop'), 380);
  if (youWon){
    A.states = [shopBoard()]; A.cursor = 0;
    A.sans = []; A.moves = []; A.marks = []; A.review = [];
    A.sel = -1; FX = null;
  }
}
/* Buying attaches the primitive to the square the piece starts on. */
function buyUpgrade(sq, bit){
  const r = A.run;
  if (!r || r.state !== 'reward') return;
  const item = SHOP.find(x => x.bit === bit);
  if (!item || r.coins < item.cost){ sfx('deny'); return; }
  if (shopFor(sq).indexOf(item) < 0){ sfx('deny'); return; }
  r.coins -= item.cost;
  r.pieces[sq] = (r.pieces[sq] || 0) | bit;
  saveRun();
  A.states = [shopBoard()];                           // show the change at once
  arcSay('<b>' + item.name + '</b> fitted to your ' +
         PIECE_NAME[fenToState(START_FEN).b[idxOf(sq)]] + ' on <b>' + sq + '</b>.');
  render();
  // the piece is gold from this moment, so make the moment land
  sfx('buy');
  const at = idxOf(sq);
  burst(at, '#e0b53a', 30, 4.4);
  burst(at, '#fff6d0', 10, 2.6);
  floatText(at, '-' + item.cost, '#ffc93f');
  shake(200, 5);
}
function nextRound(){
  if (!A.run || A.run.state !== 'reward') return;
  A.run.round++;
  A.run.state = A.run.round >= ROUNDS.length ? 'won' : 'ready';
  sfx(A.run.state === 'won' ? 'complete' : 'select', A.run.state === 'won' ? 1 : 0.9);
  A.run.shopSel = null;
  saveRun();
  // the shop board had the opponent swept off it; put them back before the
  // ready screen, or the next round is announced over an empty half
  A.states = [gauntletBoard()]; A.cursor = 0;
  render();
}

function arcSay(html){
  const el = byId('arcmsg');
  if (el){ el.innerHTML = html; el.style.animation = 'none'; void el.offsetWidth;
           el.style.animation = ''; }
}
const BUILD = 'g35';
let hudError = '';
function renderArcade(){
  if (!A.arcade || !A.run){ return; }
  const r = A.run;
  const st = byId('buildstamp');
  if (st) st.innerHTML = ' &middot; build ' + BUILD +
    (spritesReady ? '' : ' &middot; <b style="color:#ff7d63">sprites: ' +
      (spriteError || 'loading') + '</b>') +
    (hudError ? ' &middot; <b style="color:#ff7d63">hud: ' + hudError + '</b>' : '');
  byId('pips').innerHTML = ROUNDS.map((_, i) =>
    '<i class="' + (i < r.round ? 'done' : i === r.round && r.state === 'playing' ? 'now' : '') +
    '"></i>').join('');

  // what you have bought so far, by the square the piece starts on
  const owned = Object.keys(r.pieces || {}).sort();
  byId('arcupg').innerHTML = owned.length
    ? owned.map(sq => {
        const names = SHOP.filter(x => r.pieces[sq] & x.bit).map(x => x.name).join(' + ');
        return '<span class="uchip">' + sq + ' ' + names + '</span>';
      }).join('')
    : '<span class="uchip empty">nothing bought yet</span>';

  /* The shop needs the board, so between rounds the overlay stays out of the
     way: you click a piece on the board and buy for it in the panel below. */
  const ov = byId('arcover');
  if (r.state === 'reward'){
    ov.className = 'arcover on shop';
    ov.innerHTML = renderShop();
    ov.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
      const [sq, bit] = b.dataset.buy.split(':');
      buyUpgrade(sq, Number(bit));
    });
    const nx = byId('shopnext');
    if (nx) nx.onclick = nextRound;
  } else if (r.state === 'playing'){
    ov.className = 'arcover'; ov.innerHTML = '';
  } else {
    const roundN = Math.min(r.round + 1, ROUNDS.length);
    let head, sub, body = '';
    if (r.state === 'dead'){
      head = 'Run over';
      sub = 'You reached round ' + Math.min(r.best + 1, ROUNDS.length) + ' of ' + ROUNDS.length +
            ' and earned ' + r.earned + ' coins.';
      body = '<button class="abtn mag" id="ovgo">New run</button>';
    } else if (r.state === 'won'){
      head = 'Gauntlet cleared';
      sub = 'All ' + ROUNDS.length + ' rounds, on ' + r.earned + ' coins earned.';
      body = '<button class="abtn" id="ovgo">New run</button>';
    } else {
      head = 'Round ' + roundN + ' of ' + ROUNDS.length;
      sub = 'Opponent: ' + LEVELS[roundLevel()].name +
            ' &mdash; pays ' + coinRate(roundLevel()).toFixed(1) + '&times; coins';
      if (r.round === 0)
        body += '<div class="diffbar">' + DIFFS.map((x, i) =>
          '<button data-diff="' + i + '" aria-selected="' + (i === (r.diff || 0)) +
          '"><span>' + x.name + '</span></button>').join('') + '</div>';
      body += '<button class="abtn" id="ovgo">Start round ' + roundN + '</button>';
    }
    ov.className = 'arcover on';
    ov.innerHTML = '<div><h4>' + head + '</h4><p>' + sub + '</p>' + body + '</div>';
    ov.querySelectorAll('[data-diff]').forEach(b =>
      b.onclick = () => setDiff(Number(b.dataset.diff)));
    const g = byId('ovgo');
    if (g) g.onclick = () => {
      if (r.state === 'ready') startGauntletRound();
      else { newRun(); arcSay('New run. Pick a difficulty and go.'); render(); }
    };
  }

  const hud = byId('archud');
  if (r.state === 'playing'){
    hud.style.display = '';
    const flash = A.coinFlash; A.coinFlash = 0;
    /* Label above, value below, in that order every time - the eye should never
       have to work out which half of a pair is the number. */
    hud.innerHTML =
      '<span class="stat gold' + (flash ? ' pop' : '') + '"><em>Coins</em><b>' +
        r.coins + (flash ? ' <small style="color:var(--gr)">+' + flash + '</small>' : '') +
      '</b></span>' +
      '<i class="statrule"></i>' +
      '<span class="stat"><em>Round</em><b>' + Math.min(r.round + 1, ROUNDS.length) +
        '<small> / ' + ROUNDS.length + '</small></b></span>' +
      '<i class="statrule"></i>' +
      '<span class="stat"><em>Opponent</em><small>' + LEVELS[A.level].name +
        ' &middot; ' + coinRate(A.level).toFixed(1) + '&times; coins</small></span>';
  } else hud.style.display = 'none';
}
/* The shop, drawn over the opponent's empty half of the board so that what you
   are buying and the piece you are buying it for are on screen together. */
function renderShop(){
  const r = A.run;
  const sel = r.shopSel;
  const next = '<button class="abtn sm" id="shopnext">Start round ' +
               Math.min(r.round + 2, ROUNDS.length) + '</button>';
  const head = '<div class="shophead">' +
               '<span class="stat gold"><em>Coins</em><b>' + r.coins + '</b></span>' +
               next + '</div>';
  if (!sel)
    return head + '<div class="shopnote">Round clear. <b>Tap one of your pieces</b> ' +
           'to see what it can be given.</div>';
  const start = fenToState(START_FEN);
  const who = PIECE_NAME[start.b[idxOf(sel)]] || 'piece';
  const list = shopFor(sel);
  const have = SHOP.filter(x => ownedAt(sel) & x.bit).map(x => x.name);
  const rows = list.length
    ? '<div class="shoprow">' + list.map(x => {
        const afford = r.coins >= x.cost;
        return '<button class="pbtn shopbuy"' + (afford ? '' : ' disabled') +
          ' data-buy="' + sel + ':' + x.bit + '" title="' + x.desc.split('"').join('') + '">' +
          x.name + '<i>' + x.cost + '</i></button>';
      }).join('') + '</div>'
    : '<div class="shopnote">This one already does everything the shop sells.</div>';
  return head +
    '<div class="shopwho">Your <b>' + who + '</b> on ' + sel +
      (have.length ? ' &mdash; has ' + have.join(', ') : '') + '</div>' + rows;
}

/* ---- board and piece colours -------------------------------------------
   Four pickers, no presets: two for the squares and one for each side. A
   picked colour becomes a four-step ramp (shadow, mid, base, highlight) that
   the sprites are recoloured through, so the art keeps its shading. */
const THEME_KEY = 'gauntlet.theme.v1';
/* Lichess out of the box: the board people already recognise, and the one the
   black-and-white chrome was built around. */
const THEME_DEFAULT = { sqL:'#f0d9b5', sqD:'#b58863', you:'#f4f4f4', them:'#3c3a38',
                        tilt:false, night:false };
let theme = Object.assign({}, THEME_DEFAULT);

const hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const rgb2hex = c => '#' + c.map(v => Math.max(0, Math.min(255, Math.round(v)))
                                      .toString(16).padStart(2,'0')).join('');
const mix = (c, t, a) => c.map((v, i) => v + (t[i] - v) * a);
function rampFrom(hex){
  const c = hex2rgb(hex);
  return [rgb2hex(mix(c, [0,0,0], 0.80)), rgb2hex(mix(c, [0,0,0], 0.42)),
          hex,                            rgb2hex(mix(c, [255,255,255], 0.58))];
}
let RAMPS = { you: rampFrom(THEME_DEFAULT.you), them: rampFrom(THEME_DEFAULT.them),
              gold: ['#2e1f04','#8a6412','#ffc93f','#fff3c4'],
              // a piece you can take is repainted in this rather than ringed:
              // a coloured circle over pixel art always looked like a sticker
              red:  ['#3d0410','#96122e','#ff2d4e','#ffb3b3'] };

function loadTheme(){
  try { const t = JSON.parse(localStorage.getItem(THEME_KEY));
        if (t) for (const k in THEME_DEFAULT) if (t[k] !== undefined && t[k] !== null) theme[k] = t[k]; }
  catch(e){}
}
function saveTheme(){ try { localStorage.setItem(THEME_KEY, JSON.stringify(theme)); } catch(e){} }

function applyTheme(rebuild){
  const root = document.documentElement;
  const l = hex2rgb(theme.sqL);
  root.style.setProperty('--sqL', theme.sqL);
  root.style.setProperty('--sqD', theme.sqD);
  root.style.setProperty('--frame', rgb2hex(mix(l, [255,255,255], 0.22)));
  const g = mix(l, [255,255,255], 0.42);
  root.style.setProperty('--glowa', 'rgba(' + g.map(Math.round).join(',') + ',.5)');
  document.body.classList.toggle('tilt', !!theme.tilt);
  document.body.classList.toggle('night', !!theme.night);
  RAMPS.you = rampFrom(theme.you);
  RAMPS.them = rampFrom(theme.them);
  if (rebuild && A.arcade) buildSprites(); else render();
}
let rampTimer = 0;
function setColour(key, hex){
  theme[key] = hex; saveTheme();
  applyTheme(false);                              // squares update instantly
  if (key === 'you' || key === 'them'){           // sprites cost a redraw, so settle first
    clearTimeout(rampTimer);
    rampTimer = setTimeout(() => applyTheme(true), 150);
  }
}
function resetTheme(){
  theme = Object.assign({}, THEME_DEFAULT, { tilt: theme.tilt });
  saveTheme();
  const el = byId('themepanel');
  if (el) el.dataset.built = '';
  applyTheme(true);
}
function toggleTilt(){ theme.tilt = !theme.tilt; saveTheme(); applyTheme(false); }
function toggleNight(){ theme.night = !theme.night; saveTheme(); applyTheme(false); }

/* Quick starting points. The pickers below still override anything. */
const PRESETS = [
  { name:'Lichess', sqL:'#f0d9b5', sqD:'#b58863', you:'#f4f4f4', them:'#3c3a38' },
  { name:'Green',   sqL:'#eeeed2', sqD:'#769656', you:'#f4f4f4', them:'#3c3a38' },
  { name:'Neon',    sqL:'#452a86', sqD:'#1e1040', you:'#3fd0e8', them:'#ff3fa8' }
];
function usePreset(i){
  const p = PRESETS[i];
  if (!p) return;
  theme.sqL = p.sqL; theme.sqD = p.sqD; theme.you = p.you; theme.them = p.them;
  saveTheme();
  const el = byId('themepanel');
  if (el) el.dataset.built = '';        // the inputs must pick up the new values
  applyTheme(true);
}
/* Built once. Re-setting innerHTML on every change destroyed the <input> and
   closed the operating system's colour picker mid-drag, which is why picking a
   colour meant opening it again for every nudge. */
function renderTheme(){
  const el = byId('themepanel');
  if (!el) return;
  if (el.dataset.built === '1'){
    el.querySelectorAll('[data-col]').forEach(inp => {
      if (document.activeElement !== inp) inp.value = theme[inp.dataset.col];
    });
    const t = byId('ctilt');
    if (t) t.className = 'tbtn' + (theme.tilt ? ' on' : '');
    const n = byId('cnight');
    if (n) n.className = 'tbtn' + (theme.night ? ' on' : '');
    const m = byId('cmusic');
    if (m) m.className = 'tbtn' + (music.on ? ' on' : '');
    const fx = byId('csfx');
    if (fx) fx.className = 'tbtn' + (soundOn ? ' on' : '');
    // never re-set a slider the player is dragging
    for (const [id, val] of [['cvol', music.vol], ['csfxvol', sfxVol]]){
      const el = byId(id);
      if (el && document.activeElement !== el) el.value = Math.round(val * 100);
    }
    return;
  }
  const row = (key, label) =>
    '<label class="crow"><input type="color" data-col="' + key + '" value="' + theme[key] + '">' +
    '<span>' + label + '</span></label>';
  el.innerHTML =

    '<div class="presets">' + PRESETS.map((p, i) =>
      '<button data-preset="' + i + '"><i style="background:' + p.sqL + '"></i>' +
      '<i style="background:' + p.sqD + '"></i>' + p.name + '</button>').join('') + '</div>' +
    '<div class="cgrid">' +
      row('sqL', 'Light squares') + row('sqD', 'Dark squares') +
      row('you', 'Your pieces')   + row('them', 'Their pieces') +
    '</div>' +
    '<div class="tcustom">' +
      '<button class="tbtn" id="ctilt">Tilt</button>' +
      '<button class="tbtn" id="creset">Reset</button>' +
    '</div>' +
    '<div class="tcustom" style="margin-top:8px">' +
      '<button class="tbtn" id="cnight">Night mode</button>' +
    '</div>' +
    '<div class="thead" style="margin-top:10px">Sound</div>' +
    '<div class="tcustom">' +
      '<button class="tbtn" id="cmusic">Music</button>' +
      '<input type="range" id="cvol" min="0" max="100" step="1" aria-label="Music volume"' +
        ' value="' + Math.round(music.vol * 100) + '">' +
    '</div>' +
    '<div class="tcustom">' +
      '<button class="tbtn" id="csfx">Effects</button>' +
      '<input type="range" id="csfxvol" min="0" max="100" step="1" aria-label="Effects volume"' +
        ' value="' + Math.round(sfxVol * 100) + '">' +
    '</div>';
  el.dataset.built = '1';
  el.querySelectorAll('[data-col]').forEach(inp =>
    inp.oninput = e => setColour(inp.dataset.col, e.target.value));
  el.querySelectorAll('[data-preset]').forEach(b =>
    b.onclick = () => usePreset(Number(b.dataset.preset)));
  byId('ctilt').className = 'tbtn' + (theme.tilt ? ' on' : '');
  byId('ctilt').onclick = toggleTilt;
  byId('creset').onclick = resetTheme;
  byId('cnight').className = 'tbtn' + (theme.night ? ' on' : '');
  byId('cnight').onclick = toggleNight;
  byId('cmusic').className = 'tbtn' + (music.on ? ' on' : '');
  byId('cmusic').onclick = () => setMusicOn(!music.on);
  byId('cvol').oninput = e => setMusicVol(Number(e.target.value));
  byId('csfx').className = 'tbtn' + (soundOn ? ' on' : '');
  byId('csfx').onclick = () => { toggleSound(); renderTheme(); };
  byId('csfxvol').oninput = e => { setSfxVol(Number(e.target.value)); sfx('select'); };
}


/* Recolour a sprite into an arcade ramp. The art is a muted grey/cream set, so
   each opaque pixel is mapped by brightness onto a four-step neon ramp - that
   keeps the shading and the dark outline while making the pieces pop. */
const SPRITE_CACHE = {};
function recolour(src, ramp, gem){
  return new Promise(res => {
    let done = false;
    const finish = v => { if (!done){ done = true; res(v); } };
    // Safari has been known to fire load with no dimensions, and getImageData
    // can throw outright. Either way we fall back to the original sprite
    // rather than leaving Promise.all hanging and the board on SVG pieces.
    setTimeout(() => finish(src), 4000);
    const img = new Image();
    img.onload = () => { try {
      const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if (!w || !h) return finish(src);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d');
      if (!x) return finish(src);
      x.drawImage(img, 0, 0);
      const d = x.getImageData(0, 0, c.width, c.height), px = d.data;
      const cols = ramp.map(h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16),
                                  parseInt(h.slice(5,7),16)]);
      for (let i = 0; i < px.length; i += 4){
        if (px[i+3] < 8) continue;
        const lum = (px[i]*0.299 + px[i+1]*0.587 + px[i+2]*0.114) / 255;
        const c2 = cols[Math.min(cols.length - 1, Math.floor(lum * cols.length))];
        px[i] = c2[0]; px[i+1] = c2[1]; px[i+2] = c2[2];
      }
      x.putImageData(d, 0, 0);
      if (gem){                                    // mark for upgraded pieces
        x.fillStyle = '#fff3c4';
        x.fillRect(7, 18, 2, 2);
        x.fillStyle = '#ffc93f';
        x.fillRect(6, 19, 4, 2); x.fillRect(7, 21, 2, 1);
      }
      finish(c.toDataURL());
    } catch (err){ spriteError = spriteError || String(err && err.name || err); finish(src); } };
    img.onerror = () => finish(src);
    img.src = src;
  });
}
let spriteError = '';
let spritesReady = false;
async function buildSprites(){
  spriteError = '';
  const jobs = [];
  for (const k of Object.keys(SPR)){
    const mine = k === k.toUpperCase();
    jobs.push(recolour(SPR[k], mine ? RAMPS.you : RAMPS.them)
      .then(u => { SPRITE_CACHE[k] = u; }));
  }
  /* A gold copy of each of your pieces, used the moment it is carrying anything
     bought. The gold ramp is fixed rather than themed, so it stays legible
     whatever colours you pick for your own side. */
  for (const k of 'PNBRQK')
    jobs.push(recolour(SPR[k], RAMPS.gold).then(u => { SPRITE_CACHE[k + '+'] = u; }));
  // ...and a danger copy of theirs, shown when the piece you have picked up
  // can take it
  for (const k of 'pnbrqk')
    jobs.push(recolour(SPR[k], RAMPS.red).then(u => { SPRITE_CACHE[k + '!'] = u; }));
  // the roguelike pieces borrow the bishop and rook art with a gold ramp
  jobs.push(recolour(SPR.B, RAMPS.gold, true).then(u => { SPRITE_CACHE.A = u; }));
  jobs.push(recolour(SPR.R, RAMPS.gold, true).then(u => { SPRITE_CACHE.C = u; }));
  jobs.push(recolour(SPR.b, RAMPS.them, true).then(u => { SPRITE_CACHE.a = u; }));
  jobs.push(recolour(SPR.r, RAMPS.them, true).then(u => { SPRITE_CACHE.c = u; }));
  jobs.push(recolour(SPR.Q, RAMPS.gold, true).then(u => { SPRITE_CACHE.M = u; }));
  jobs.push(recolour(SPR.q, RAMPS.them, true).then(u => { SPRITE_CACHE.m = u; }));
  await Promise.all(jobs);
  spritesReady = true;
  if (A.arcade) render();
}
function spriteFor(ch){ return SPRITE_CACHE[ch] || null; }



/* ---- particles ---------------------------------------------------------- */
const FX_P = [];
let fxRaf = 0, shakeUntil = 0, shakeAmt = 0;
function burst(sq, colour, n, power){
  const b = byId('board').getBoundingClientRect();
  const cell = b.width / 8, v = view(sq);
  const cx = (colOf(v) + 0.5) * cell, cy = (rowOf(v) + 0.5) * cell;
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, sp = (0.5 + Math.random()) * (power || 3.2);
    FX_P.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
                life: 1, size: 2 + Math.floor(Math.random() * 3), col: colour });
  }
  startFx();
}
function floatText(sq, text, colour){
  const b = byId('board').getBoundingClientRect();
  const cell = b.width / 8, v = view(sq);
  const el = document.createElement('div');
  el.className = 'floaty';
  el.textContent = text;
  el.style.color = colour;
  el.style.left = ((colOf(v) + 0.5) * cell) + 'px';
  el.style.top = ((rowOf(v) + 0.2) * cell) + 'px';
  byId('boardfx').appendChild(el);
  setTimeout(() => el.remove(), 1100);
}
function shake(ms, amt){ shakeUntil = performance.now() + ms; shakeAmt = amt; startFx(); }
function startFx(){ if (!fxRaf) fxRaf = requestAnimationFrame(stepFx); }
let dustAt = 0;
function stepFx(){
  const cv = byId('fxcanvas');
  if (!cv){ fxRaf = 0; return; }
  // a few slow motes drifting over the board: cheap, and it stops the field
  // looking like a static diagram between moves
  const nowT = performance.now();
  if (A.arcade && A.run && A.run.state === 'playing' && nowT - dustAt > 420 && FX_P.length < 26){
    dustAt = nowT;
    const w = cv.width || 1;
    FX_P.push({ x: Math.random() * w, y: cv.height + 4, vx: (Math.random()-.5) * .18,
                vy: -0.12 - Math.random() * 0.16, life: 1, decay: 0.0022,
                size: 2, col: '#ffffff', dim: 0.16 });
  }
  const b = byId('board').getBoundingClientRect();
  if (cv.width !== Math.round(b.width)){ cv.width = Math.round(b.width); cv.height = Math.round(b.height); }
  const x = cv.getContext('2d');
  x.clearRect(0, 0, cv.width, cv.height);
  for (let i = FX_P.length - 1; i >= 0; i--){
    const p = FX_P[i];
    p.x += p.vx; p.y += p.vy;
    if (!p.dim){ p.vy += 0.22; p.vx *= 0.99; }      // dust ignores gravity
    p.life -= (p.decay || 0.026);
    if (p.life <= 0 || p.y < -6){ FX_P.splice(i, 1); continue; }
    x.globalAlpha = Math.max(0, Math.min(1, p.life)) * (p.dim || 1);
    x.fillStyle = p.col;
    x.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
  }
  x.globalAlpha = 1;
  const now = performance.now();
  const wrap = byId('boardwrap');
  if (now < shakeUntil){
    const k = shakeAmt * ((shakeUntil - now) / 260);
    wrap.style.transform = 'translate(' + ((Math.random()-.5)*k).toFixed(1) + 'px,' +
                                          ((Math.random()-.5)*k).toFixed(1) + 'px)';
  } else if (wrap) wrap.style.transform = '';
  const keepAlive = A.arcade && A.run && A.run.state === 'playing';
  if (FX_P.length || now < shakeUntil || keepAlive) fxRaf = requestAnimationFrame(stepFx);
  else fxRaf = 0;
}
function arcadeMoveFx(mv, after){
  if (!A.arcade) return;
  const mine = colorOf(mv.p) === A.playSide;
  if (mv.cap){
    /* The bigger the piece, the bigger the mess. Coins are no longer paid for
       captures, so the float text was removed with the charges economy - the
       grade text is what pops now, and it comes from awardCoins. */
    const heft = VALUE[mv.cap.toUpperCase()] || 1;
    const col = mine ? '#ff3fa8' : '#3fd0e8';       // the colour of what died
    burst(mv.t, col, 16 + heft * 4, 3.4 + heft * 0.35);
    burst(mv.t, '#ffffff', 4 + heft, 2.2 + heft * 0.2);
    shake(180 + heft * 22, (mine ? 4 : 6) + heft);
  } else {
    burst(mv.t, mine ? '#3fd0e8' : '#ff3fa8', 5, 1.6);
  }
  if (mv.promo) burst(mv.t, '#e0b53a', 26, 4.6);
  if (inCheck(after, after.t)){
    const w = byId('boardwrap');
    w.classList.remove('checkflash'); void w.offsetWidth; w.classList.add('checkflash');
    shake(260, 6);
  }
}
function bannerFx(text, sub, cls){
  const el = byId('banner');
  el.className = 'banner ' + (cls || '') + ' show';
  el.innerHTML = '<b>' + text + '</b>' + (sub ? '<span>' + sub + '</span>' : '');
  setTimeout(() => el.classList.remove('show'), 2400);
  if (cls === 'win'){
    for (let i = 0; i < 60; i++)
      setTimeout(() => burst(Math.floor(Math.random()*64),
        ['#3fd0e8','#ffc93f','#52ff9a','#ff3fa8'][i % 4], 4, 5), i * 14);
  }
}

/* =========================================================================
   11. BOOT
   ========================================================================= */
/* Straight into the run: this build has one mode and no menu in front of it. */
loadRun();
loadTheme();
document.querySelector('.main').appendChild(byId('arcbot'));
setMode('run');
</script>
